<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PMT{% endblock %} · PMT</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% if user %}
<header class="topbar">
  <nav aria-label="Main">
    <a href="/">My Queue</a><a href="/projects">Projects</a>{% if user.is_cto %}<a href="/admin">Admin</a>{% endif %}
  </nav>
  <div class="who">
    <span>{{ user.name }}</span>
    <form method="post" action="/logout" class="inline"><button class="btn secondary">Log out</button></form>
  </div>
</header>
{% endif %}
<main id="main">{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
</body>
</html>
