html { font-size: var(--size); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.47;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 64rem; margin: 0 auto; padding-block: 1.25rem 3rem; }
h1 { font-size: 2.125rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: .25rem 0 1rem; text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; margin: 1.75rem 0 .6rem; text-wrap: balance; }
a, .linkish { color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; text-decoration: none; }
.linkish:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Demo strip */
.demo { background: var(--demo); font-size: .85rem; border-bottom: 1px solid var(--sep); }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-block: .4rem; }
.demo-in strong { letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; }
.demo select { min-height: 2rem; padding: .15em .6em; }
.demo .btn { min-height: 2rem; padding: .25em .9em; font-size: .85rem; }

/* Navigation bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--sep); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding-block: .55rem; max-width: 64rem; margin: 0 auto; box-sizing: content-box; }
.topbar-in > strong { font-size: 1.05rem; letter-spacing: -.02em; }
.topbar nav { display: flex; flex-wrap: wrap; gap: .25rem; flex: 1; }
.topbar nav button { font-weight: 600; padding: .35rem .85rem; border-radius: 999px; }
.topbar nav button:hover { text-decoration: none; background: var(--tint); }
.topbar nav button[aria-current="page"] { background: var(--tint); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; padding: .4rem .95rem; border-radius: 999px; background: var(--tint); color: var(--accent); font-weight: 600; }
.menu summary::-webkit-details-marker { display: none; }
.menu-body { position: absolute; right: 0; z-index: 25; width: min(19rem, calc(100vw - 32px)); margin-top: .5rem; padding: 1rem; max-height: calc(100vh - 5rem); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: grid; gap: .9rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; font-size: .95rem; padding: 0 0 .35rem; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: .6rem; }
.seg { display: block; text-align: center; padding: .4rem .5rem; border-radius: .5rem; font-weight: 600; font-size: .9rem; cursor: pointer; }
.seg:has(input:checked) { background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .22); }
.seg:has(input:focus-visible) { outline: 3px solid var(--accent); }

/* Buttons */
.btn { font: inherit; font-size: 1rem; font-weight: 600; padding: .55em 1.25em; border-radius: 999px; cursor: pointer; border: 0;
  min-height: 2.75rem; letter-spacing: -.01em; transition: transform .12s ease, filter .12s ease; }
.btn.primary { background: var(--btn); color: var(--on-btn); }
.btn.secondary { background: var(--tint); color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }

/* Form controls */
label { display: grid; gap: .3rem; font-weight: 600; font-size: .95rem; }
input, select, textarea { font: inherit; font-size: 1rem; max-width: 100%; min-height: 2.75rem; border-radius: var(--radius-sm); }
select, input[type="date"], input[type="time"], input[type="number"] { color: var(--text); background: var(--surface-2); border: 1px solid var(--sep-strong); padding: .45em .6em; }

  color: var(--inv-fg); caret-color: var(--inv-link); padding: .55em .8em; border: 2px solid transparent;
  background: linear-gradient(var(--inv-bg), var(--inv-bg)) padding-box, var(--metal) border-box; }
textarea { width: 100%; resize: vertical; }
textarea::placeholder, input::placeholder { color: var(--inv-muted); opacity: 1; }

label.check { display: flex; align-items: center; gap: .7rem; font-weight: 500; }
label.check input[type="checkbox"] { -webkit-appearance: none; appearance: none; flex: none; width: 3.1rem; height: 1.9rem; min-height: 0;
  margin: 0; border: 0; border-radius: 999px; background: var(--switch-off); position: relative; cursor: pointer; transition: background .2s; }
label.check input[type="checkbox"]::before { content: ""; position: absolute; top: .15rem; left: .15rem; width: 1.6rem; height: 1.6rem;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .2s; }
label.check input[type="checkbox"]:checked { background: var(--switch-on); }
label.check input[type="checkbox"]:checked::before { transform: translateX(1.2rem); }
.stack { display: grid; gap: .85rem; }
.stack > .btn { justify-self: start; }
.narrow { max-width: 24rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: .75rem 0; }
.row > label { min-width: 0; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
.head-row h1, .head-row h2 { margin-block: .5rem; }

.tbl { overflow-x: auto; margin: .5rem 0 1.25rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--card-shadow); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .7rem .9rem; vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--sep); }
tbody tr + tr td { border-top: 1px solid var(--sep); }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .linkish { font-weight: 600; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 1.1rem; margin: var(--space) 0; box-shadow: var(--card-shadow); }
.panel > h2:first-child { margin-top: 0; }
summary { cursor: pointer; font-weight: 600; }
.pre { white-space: pre-wrap; }
.note { color: var(--muted); margin: 0; font-size: .9rem; }
.flash { border-radius: var(--radius); padding: .75rem 1rem; margin-bottom: 1rem; font-weight: 600; background: var(--surface);
  box-shadow: var(--card-shadow), inset 4px 0 0 currentColor; }
.flash.error { color: var(--error); }
.flash.ok { color: var(--ok); }
.history { padding-left: 1.5rem; margin: 0; }
.history li { margin-bottom: .5rem; }
.history strong { font-weight: 600; }
blockquote { margin: .3rem 0 0; padding-left: .75rem; border-left: 3px solid var(--sep-strong); }
code { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }
.crumb { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .3rem 1rem; margin: 0; }
.kv dt { font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; }
.stage-list { margin: .25rem 0 .75rem; padding-left: 1.75rem; display: grid; gap: .4rem; }
.team-row.wiz { display: grid; grid-template-columns: minmax(14rem, 22rem) minmax(0, 1fr) auto; gap: .75rem; align-items: start;
  padding-bottom: .85rem; border-bottom: 1px solid var(--sep); }
.team-row.wiz > .btn { margin-top: 1.75rem; }
@media (max-width: 40rem) { .team-row.wiz { grid-template-columns: 1fr; } .team-row.wiz > .btn { justify-self: start; margin-top: 0; } }
.role-picks { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
.team-row.wiz > label, .role-picks > label { min-width: 0; }
.team-row.wiz select { width: 100%; min-width: 0; text-overflow: ellipsis; }
.role-picks > label { flex: 0 1 13rem; }
.role-picks > label select { width: 100%; min-width: 0; text-overflow: ellipsis; }
.to-picks > label { flex: 1 1 16rem; max-width: 24rem; }
.role-extra { display: flex; gap: .5rem; align-items: end; }
.role-extra .linkish, .add-role { padding-bottom: .7rem; font-weight: 600; white-space: nowrap; }
.chip-x { background: none; border: 0; color: inherit; font: inherit; font-weight: 700; cursor: pointer; margin-left: .35rem; padding: 0 .15rem; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 .75rem; }

/* Chips: stage family, priority, comment type */
.label { display: inline-block; padding: .1rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--sep-strong); }
.label.st-an, .label.pr-normal { background: var(--an-bg); color: var(--an-fg); border-color: currentColor; }
.label.st-dev { background: var(--dev-bg); color: var(--dev-fg); border-color: currentColor; }
.label.st-qa { background: var(--qa-bg); color: var(--qa-fg); border-color: currentColor; }
.label.st-ap { background: var(--ap-bg); color: var(--ap-fg); border-color: currentColor; }
.label.st-fb, .label.pr-high { background: var(--fb-bg); color: var(--fb-fg); border-color: currentColor; }
.label.st-cl, .label.pr-low { background: var(--cl-bg); color: var(--cl-fg); border-color: currentColor; }
.label.st-new { background: var(--new-bg); color: var(--new-fg); border-color: currentColor; }
.label.tag-int { background: var(--int); color: var(--bg); border-color: var(--int); }

dialog.card[open] { display: flex; flex-direction: column; overflow: hidden; }
dialog.card > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
dialog.card::backdrop { background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .85rem 1.1rem; flex: none;
  background: var(--glass); border-bottom: 1px solid var(--sep); }
.card-head h2 { margin: 0; font-size: 1.1rem; }
.card-phases { padding: .85rem 1.1rem 0; flex: none; }
.card-body { padding: 1rem 1.1rem; display: grid; gap: .85rem; overflow-y: auto; min-height: 0; }
.card-body > * { min-width: 0; }
.card-foot { flex: none; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: flex-end; padding: .85rem 1.1rem;
  background: var(--glass); border-top: 1px solid var(--sep); }
.card-foot .spacer { flex: 1; }
.x { font: inherit; font-size: 1rem; line-height: 1; width: 2rem; height: 2rem; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface-2); color: var(--text); display: grid; place-items: center; }
.card-section { background: var(--surface); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--card-shadow); }
.fl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .3rem; }
.title-view { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; margin: 0; text-wrap: balance; }
.meta { margin: .45rem 0 0; display: flex; flex-wrap: wrap; gap: .35rem .75rem; align-items: center; }

/* Step line (new project) */
.phases-wrap { overflow-x: auto; padding: .25rem 0 .6rem; border-bottom: 1px solid var(--sep); }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(5rem, 1fr); isolation: isolate; }
.phases li { position: relative; text-align: center; font-size: .8rem; }
.phases li::before { content: ""; position: absolute; top: calc(1rem - 1.5px); right: 50%; width: 100%; height: 3px; background: var(--sep-strong); z-index: 0; }
.phases li:first-child::before { display: none; }
.phases li.done::before, .phases li.current::before { background: var(--btn); }
.phase { position: relative; z-index: 1; display: grid; justify-items: center; gap: .25rem; padding: 0 .1rem; }
.dot { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 2px solid var(--sep-strong); background: var(--surface); color: var(--text); }
.done .dot { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.current .dot { border: 3px solid var(--btn); color: var(--accent); }
.phase-name { line-height: 1.2; font-size: .75rem; overflow-wrap: anywhere; }
.current .phase-name { font-weight: 700; }
.phase-tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); min-height: 1.1em; }

/* Inverted panels with metal rim: comments, file rows, emails */
.cmt-list { display: grid; gap: .6rem; }
.cmt, .files li.file, .mail { color: var(--inv-fg); border: 1.5px solid transparent; border-radius: .9rem;
  background: linear-gradient(var(--inv-bg), var(--inv-bg)) padding-box, var(--metal) border-box; }
.cmt { padding: .7rem .95rem; box-shadow: inset 4px 0 0 var(--inv-link); }
.cmt.is-internal { box-shadow: inset 4px 0 0 var(--inv-int); }
.cmt-head { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; }
.cmt-head time { font-size: .85rem; font-variant-numeric: tabular-nums; }
.cmt-head time, .cmt .file-meta, .files li.file .file-meta, .mail .file-meta { color: var(--inv-muted); }
.cmt-text { margin: .35rem 0 0; }
.files { list-style: none; margin: 0 0 .6rem; padding: 0; display: grid; gap: .45rem; }
.files li.file { display: flex; align-items: center; gap: .75rem; padding: .55rem .8rem; }
.files li.file .linkish { color: var(--inv-link); }
.ext { flex: none; min-width: 3.2rem; text-align: center; font: 700 .72rem/1 var(--mono); letter-spacing: .04em; padding: .45rem .3rem;
  border-radius: .5rem; background: var(--inv-link); color: var(--inv-bg); }
.file-main { display: grid; min-width: 0; flex: 1; }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.mail { padding: .7rem .95rem; margin-bottom: .55rem; }
.files li.file a.file-name { color: var(--inv-link); text-decoration: none; }
.files li.file a.file-name:hover { text-decoration: underline; }
.arc-sum { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .75rem; }
.arc-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -.015em; }
details.arc { margin: .75rem 0; }
.links-block { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--sep); }
.mail pre { white-space: pre-wrap; font-family: var(--mono); font-size: .85rem; margin: .3rem 0 0; }
/* Top bar project search */
.tsearch { position: relative; }
.combo { position: relative; }
.added-ack { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
.combo input { width: 100%; }
.combo-list { position: absolute; left: 0; right: 0; top: calc(100% + .3rem); z-index: 30; margin: 0; padding: .35rem; max-height: 15rem; overflow-y: auto; min-width: 14rem;
  list-style: none; background: var(--surface); border: 1px solid var(--sep-strong); border-radius: var(--radius); box-shadow: var(--shadow); font-weight: 400; }
.combo-list [role=option] { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem .6rem; border-radius: .6rem; cursor: pointer; color: var(--text); }
.combo-list [role=option].on, .combo-list [role=option]:hover { background: var(--tint); }
.combo-list .none { padding: .5rem .6rem; color: var(--muted); }
.tsearch input { width: 13rem; min-height: 2.3rem; padding: .35em .8em; border-radius: 999px; }
.tsearch-results { position: absolute; right: 0; top: calc(100% + .45rem); z-index: 26; width: min(22rem, calc(100vw - 32px)); margin: 0; padding: .35rem;
  list-style: none; background: var(--surface); border: 1px solid var(--sep-strong); border-radius: var(--radius); box-shadow: var(--shadow); }
.tsearch-results li button { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: center; text-align: left;
  background: none; border: 0; color: var(--text); font: inherit; padding: .5rem .6rem; border-radius: .6rem; cursor: pointer; }
.tsearch-results li button:hover, .tsearch-results li button:focus-visible { background: var(--tint); }
.tsearch-results .code { font: 700 .85rem var(--mono); color: var(--accent); }
.tsearch-results .pname { overflow-wrap: anywhere; }
.tsearch-results .grp { padding: .45rem .6rem .15rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tsearch-results .none { padding: .5rem .6rem; color: var(--muted); }
@media (max-width: 40rem) { .tsearch { order: 5; flex: 1 1 100%; } .tsearch input { width: 100%; } .tsearch-results { left: 0; right: auto; } }
/* Notifications */
.badge { display: inline-grid; place-items: center; min-width: 1.35rem; height: 1.35rem; padding: 0 .35rem; margin-left: .2rem; border-radius: 999px;
  background: var(--btn); color: var(--on-btn); font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.notifs { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .6rem; }
.notif { display: flex; align-items: center; gap: .9rem; padding: .75rem 1rem; background: var(--surface); border: 1px solid var(--sep-strong);
  border-radius: var(--radius); box-shadow: var(--card-shadow); }
.notif.is-new { box-shadow: var(--card-shadow), inset 4px 0 0 var(--btn); }
.notif-main { flex: 1; min-width: 0; }
.notif-text { margin: 0; overflow-wrap: anywhere; }
.notif .file-meta { margin: .2rem 0 0; }
@media (max-width: 30rem) { .notif { flex-wrap: wrap; } }
/* Project card: wide sheet with Primary / Overview tabs */
dialog.card.wide { width: min(80rem, calc(100vw - 32px)); }
dialog.card.narrow { width: min(30rem, calc(100vw - 32px)); }
dialog.card > .pwrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.card-tabs { flex: none; padding: .75rem 1.1rem .1rem; }
.tabs { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: .65rem; }
.tab { font: inherit; font-weight: 600; border: 0; background: none; color: var(--text); padding: .45rem 1.3rem; border-radius: .55rem; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .22); }
.sec-title { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; margin: 0 0 .55rem; }
.head-row .sec-title { margin: 0; }
.back-btn { min-height: 2rem; padding: .2em .8em; font-size: .9rem; }
.card-head h2 { flex: 1; }
.fb-alert { box-shadow: var(--card-shadow), inset 4px 0 0 var(--int); }
.extend { display: flex; gap: .4rem; align-items: center; }
.extend input { min-height: 2.2rem; padding: .25em .4em; }
.extend .btn { min-height: 2.2rem; padding: .25em .9em; font-size: .9rem; }
tr.tl-project td { background: var(--surface-2); }
.qbtn { min-height: 2.1rem; padding: .25em .9em; font-size: .88rem; white-space: nowrap; }
.file-plain { list-style: none; padding: .3rem 0; }
.tl-why { color: var(--muted); }
.tl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.tl-item { border: 1px solid var(--sep-strong); border-radius: var(--radius); padding: .75rem 1rem; background: var(--surface-2); }
.tl-item.tl-project { box-shadow: inset 4px 0 0 var(--btn); }
.tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; font-size: 1.02rem; }
.tl-num { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.tl-dates { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem 1rem; margin: .55rem 0 0 1.6rem; }
.tl-dates dt { color: var(--muted); font-weight: 600; }
.tl-dates dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 30rem) { .tl-dates { grid-template-columns: 1fr; margin-left: 0; } .tl-dates dd { margin-bottom: .3rem; } }
/* Menu position: top bar (default) or side bar */
.tb-spacer { flex: 1; }
:root[data-nav="side"] .topbar-in { max-width: none; }
/* Every page starts at the same left edge beside the menu and uses the same width. */
:root[data-nav="side"] main { margin: 0; width: 100%; max-width: 76rem; padding-block: 1.5rem 3rem; padding-left: 2rem; padding-right: max(2rem, env(safe-area-inset-right, 0px)); }
@media (max-width: 48rem) { :root[data-nav="side"] main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.navtoggle { min-height: 2.3rem; padding: .3em .9em; font-size: .9rem; display: inline-flex; align-items: center; gap: .45rem; }
.nt-ico { width: 1rem; height: .85rem; border: 2px solid currentColor; border-radius: 3px; position: relative; }
.nt-ico::after { content: ""; position: absolute; background: currentColor; }
.nt-ico.to-side::after { left: 0; top: 0; bottom: 0; width: 35%; }
.nt-ico.to-top::after { left: 0; right: 0; top: 0; height: 35%; }
:root[data-nav="side"] .shell { display: grid; grid-template-columns: 14rem minmax(0, 1fr); align-items: start; }
.sidenav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 3.5rem)); min-height: calc(100dvh - var(--topbar-h, 3.5rem));
  max-height: calc(100dvh - var(--topbar-h, 3.5rem)); overflow-y: auto; padding: 1rem .75rem 1rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-right: 1px solid var(--sep-strong); }
.side-nav { display: flex; flex-direction: column; gap: .2rem; }
.side-nav button { text-align: left; padding: .6rem .85rem; border-radius: .65rem; font-weight: 600; text-decoration: none; }
.side-nav button:hover, .side-nav button[aria-current="page"] { background: var(--tint); text-decoration: none; }
@media (max-width: 48rem) {
  :root[data-nav="side"] .shell { display: block; }
  .sidenav { position: static; min-height: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--sep-strong); padding: .5rem max(16px, env(safe-area-inset-left, 0px)); }
  .side-nav { flex-direction: row; flex-wrap: wrap; }
}
.dl-bar .extend { flex-wrap: wrap; }
.pwrap [role=tabpanel] { grid-template-columns: minmax(0, 1fr); }
.pwrap [role=tabpanel] > * { min-width: 0; }
/* How To */
.howto { max-width: 46rem; }
.howto-panel { max-width: 64rem; margin: 0 0 .6rem; border: 1px solid var(--sep-strong); border-radius: var(--radius); background: var(--surface); }
.howto-panel > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; padding: .85rem 1rem .85rem 2.4rem; position: relative; border-radius: var(--radius); }
.howto-panel > summary::-webkit-details-marker { display: none; }
.howto-panel > summary::before { content: "›"; position: absolute; left: 1rem; top: .7rem; font-size: 1.3rem; line-height: 1; color: var(--accent); transition: transform .15s; }
.howto-panel[open] > summary::before { transform: rotate(90deg); }
.howto-panel > summary:hover { background: var(--tint); }
.howto-panel > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ht-title { font-weight: 700; font-size: 1.1rem; }
.ht-sub { color: var(--muted); font-size: .88rem; }
.ht-body { padding: 0 1rem 1rem 2.4rem; }
.ht-body ol, .ht-body ul { margin: .3rem 0 0; padding-left: 1.3rem; display: grid; gap: .35rem; }
.ht-h { margin: 1rem 0 .2rem; font-size: 1rem; }
.ht-body > .ht-h:first-child { margin-top: .2rem; }
.ht-body .who { margin: 0 0 .3rem; }
.hier ol { margin-top: .4rem; border-left: 2px solid var(--sep-strong); padding-left: 1.2rem; }
.ht-matrix th[scope=row] { font-weight: 500; text-align: left; text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--text); min-width: 14rem; }
.ht-matrix thead th { white-space: normal; text-align: center; vertical-align: bottom; }
.ht-matrix thead th:first-child { text-align: left; }
.ht-matrix td { text-align: center; white-space: normal; }
.ht-matrix .yes { color: var(--accent); font-weight: 700; }
.ht-matrix .no { color: var(--muted); }
.ht-matrix .cond { font-size: .8rem; color: var(--muted); }
.ht-matrix tr.grp th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--tint); }
@media (max-width: 40rem) { .ht-body { padding-left: 1rem; } }
.howto h2 { margin-top: 1.6rem; }
.howto .who { margin: -.2rem 0 .4rem; }
.howto ol, .howto ul { margin: .3rem 0 0; padding-left: 1.4rem; display: grid; gap: .35rem; }
/* Brightness and contrast: applied to everything on the page */
:root { --bri: 1; --con: 1; }
.demo, .topbar, .shell, dialog.card { filter: brightness(var(--bri)) contrast(var(--con)); }
.shell { min-height: calc(100dvh - var(--topbar-h, 3.5rem)); }
input.lvl { width: 100%; min-height: 1.6rem; padding: 0; accent-color: var(--btn); }
/* Reminders: calendar, day panel, lists and notes */
.org-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
.org-grid .panel { margin: 0; }
@media (max-width: 60rem) { .org-grid { grid-template-columns: 1fr; } }
.cal-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
.cal-head h2 { margin: 0; flex: 1; text-align: center; font-size: 1.15rem; }
.cal-nav { min-height: 2.2rem; padding: .2em .9em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: .2rem 0; }
.cal-cell { min-height: 5.2rem; display: flex; flex-direction: column; gap: 2px; align-items: stretch; text-align: left; padding: .3rem; border-radius: .55rem;
  background: var(--surface-2); border: 1px solid transparent; color: var(--text); font: inherit; font-size: .78rem; cursor: pointer; overflow: hidden; min-width: 0; }
.cal-cell:hover { border-color: var(--sep-strong); }
.cal-cell.is-empty { background: none; cursor: default; }
.cal-cell.is-today .cal-num { background: var(--btn); color: var(--on-btn); }
.cal-cell.is-sel { border: 2px solid var(--accent); }
.cal-num { align-self: flex-start; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.5rem; height: 1.5rem; display: grid; place-items: center; border-radius: 999px; }
.cal-item { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 .3rem; border-radius: .3rem; background: var(--an-bg); color: var(--an-fg); }
.cal-item.is-late { background: var(--fb-bg); color: var(--fb-fg); }
.cal-item.is-done { background: var(--cl-bg); color: var(--cl-fg); text-decoration: line-through; }
.cal-more { color: var(--muted); padding: 0 .3rem; }
@media (max-width: 40rem) { .cal-cell { min-height: 3rem; } .cal-item, .cal-more { display: none; } .cal-cell:has(.cal-item) .cal-num::after { content: ""; } }
.rem-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.rem { display: flex; align-items: flex-start; gap: .7rem; padding: .6rem .7rem; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--sep-strong); }
.rem.is-late { box-shadow: inset 4px 0 0 var(--fb-fg); }
.rem.is-done .rem-title { text-decoration: line-through; color: var(--muted); }
.rem-check { display: block; padding-top: .15rem; }
.rem-check input { width: 1.3rem; height: 1.3rem; min-height: 0; margin: 0; accent-color: var(--btn); cursor: pointer; }
.rem-main { flex: 1; min-width: 0; }
.rem-title { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.rem-main .file-meta, .rem-note { margin: .15rem 0 0; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .6rem; margin-top: .9rem; }
.note-card { padding: .7rem .9rem; border-radius: var(--radius); color: var(--inv-fg); border: 1.5px solid transparent;
  background: linear-gradient(var(--inv-bg), var(--inv-bg)) padding-box, var(--metal) border-box; }
.note-card .cmt-head { justify-content: space-between; }
.note-proj { display: inline-block; margin-bottom: .35rem; padding: .1rem .6rem; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-size: .75rem; font-weight: 700;
  background: var(--inv-link); color: var(--inv-bg); }
.note-card .file-meta { color: var(--inv-muted); flex: 1; }
.note-card .x { background: transparent; color: var(--inv-fg); }
/* Accent colour options (Red is the default palette above). Each pair is checked for 4.5:1 in both themes. */
:root[data-appearance="light"][data-accent="blue"] { --accent: #0A4F9E; --btn: #0A4F9E; --tint: rgba(10, 79, 158, .12); --inv-link: #8CC4FF; }
:root[data-appearance="dark"][data-accent="blue"] { --accent: #6CB6FF; --btn: #0062CC; --tint: rgba(108, 182, 255, .18); --inv-link: #0050B8; }
:root[data-appearance="light"][data-accent="green"] { --accent: #17602F; --btn: #17602F; --tint: rgba(23, 96, 47, .12); --inv-link: #7FE0A0; }
:root[data-appearance="dark"][data-accent="green"] { --accent: #5FD68A; --btn: #18723A; --tint: rgba(95, 214, 138, .18); --inv-link: #17602F; }
:root[data-appearance="light"][data-accent="purple"] { --accent: #5B2AA6; --btn: #5B2AA6; --tint: rgba(91, 42, 166, .12); --inv-link: #C9A8FF; }
:root[data-appearance="dark"][data-accent="purple"] { --accent: #B794FF; --btn: #6A35C9; --tint: rgba(183, 148, 255, .18); --inv-link: #5B21B6; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.swatch { display: grid; justify-items: center; gap: .25rem; padding: .4rem .2rem; border-radius: .6rem; cursor: pointer; font-weight: 600; font-size: .78rem; border: 2px solid transparent; }
.swatch:has(input:checked) { border-color: var(--accent); background: var(--tint); }
.swatch:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw-dot { width: 1.6rem; height: 1.6rem; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--sep-strong); }
/* Selected side-menu tab gets an outline */
.side-nav button[aria-current="page"] { box-shadow: inset 0 0 0 2px var(--accent); }
/* Sign-in */
.login-wrap { display: grid; place-items: start center; padding: 2.5rem 0 3rem; }
.login-card { width: min(26rem, 100%); background: var(--surface); border: 1px solid var(--sep-strong); border-radius: 1.1rem; padding: 1.6rem 1.5rem; box-shadow: var(--shadow); }
.login-card h1 { font-size: 1.6rem; margin: 1rem 0 .4rem; }
.login-logo { display: flex; align-items: center; gap: .7rem; color: var(--text); }
.login-logo .brand-mark { width: 4.2rem; height: 2.8rem; }
.login-logo .brand-idlc { font-size: 2.1rem; }
.login-logo .brand-streams { font-size: .8rem; }
.login-card .stack { margin-top: .75rem; }
.login-card .stack > .btn { justify-self: stretch; }
.login-demo { margin-top: 1.2rem; padding-top: .9rem; border-top: 1px solid var(--sep); }
.login-card .row { justify-content: space-between; }

const proj = id => S.projects.find(p => p.id === id);

function require_(u, ok, msg, pid) { if (ok) return false; if (isHead(u, pid)) return true; throw new Forbidden(msg); }

// Project priority and deadline: the CTO, the Project Lead and the Dev Lead can set or change them.
const canPlan = (u, pid) => isHead(u, pid) || has(pid, u.id, "Dev Lead");
function setPlan(u, pid, priority, start) {
  if (!canPlan(u, pid)) throw new Forbidden("Only the CTO, the Project Lead or the Dev Lead change the project priority and dates.");
  if (!PRIORITIES.includes(priority)) throw new RuleError("Choose a priority.");
  if (!start) throw new RuleError("The start date is required.");
  const p = proj(pid), oldP = p.priority || "Normal", oldS = p.start || null;
  checkDates(start, p.deadline, "end date");

// Timeline: every end-date change is kept, so extensions and days deviated can be shown.
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / DAY);
const dayWord = n => `${n} day${Math.abs(n) === 1 ? "" : "s"}`;
function deviation(ends) {
  if (!ends.length) return `<span class="note">No end date</span>`;
  const d = dayDiff(ends[0], ends[ends.length - 1]);

}
// End date extensions: anyone allowed asks with a reason; the Project Lead (or the Project Head) accepts or declines.
const canApproveExt = (u, pid) => u.cto || has(pid, u.id, "Project Lead");
const extTarget = (kind, id) => kind === "project" ? proj(id) : req(id);

const extName = (kind, id) => kind === "project" ? "Whole project" : `${reqCode(req(id))} ${req(id).title}`;
const pendingExt = t => (t.extReqs || []).find(x => x.status === "pending");
function canRequestExt(u, kind, id) {
  if (kind === "project") return canPlan(u, id);
  const r = req(id); return r.stage !== 8 && (canPlan(u, r.pid) || holds(r, u.id));
}
const baseStart = (kind, t) => kind === "project" ? t.start : (t.start || isoDay(t.created));
const fieldWord = f => f === "start" ? "start date change" : "end date extension";
const forWord = (kind, id) => kind === "project" ? "" : ` for ${reqCode(req(id))}`;
function applyExt(u, kind, id, date, reason, by, field = "end") {
  const t = extTarget(kind, id), pid = extPid(kind, id), proj_ = kind === "project";
  let old;

    old = baseStart(kind, t); t.starts = t.starts || (old ? [old] : []); t.starts.push(date); t.start = date; (t.startWhy = t.startWhy || {})[t.starts.length - 1] = reason;
  } else {

function requestExt(u, kind, id, date, reason, field = "end") {
  const t = extTarget(kind, id); if (!t) throw new RuleError("Choose what the date change is for.");

  if (!canRequestExt(u, kind, id)) throw new Forbidden("Only the Project Head, Project Lead, Dev Lead or the people a requirement is assigned to can ask for a date change.");

  if (!reason) throw new RuleError("Write the reason for the date change. It is required.");

function decideExt(u, kind, id, ok) {
  const t = extTarget(kind, id), pid = extPid(kind, id), x = pendingExt(t);
  if (!canApproveExt(u, pid)) throw new Forbidden("Only the Project Lead or the Project Head accept or decline date change requests.");

function extTable(u, items, withProject, decide) {

// Username is made from the name: first name, then first.last, then first.last2, 3…
function genUsername(name, skipId) {
  const parts = String(name).replace(/\(.*?\)/g, " ").toLowerCase().replace(/[^a-z0-9 ]/g, "").split(/\s+/).filter(Boolean);
  if (!parts.length) return "";
  const taken = un => S.users.some(x => x.id !== skipId && x.username.toLowerCase() === un);
  const first = parts[0], last = parts.length > 1 ? parts[parts.length - 1] : "";
  for (const c of [first, last && `${first}.${last}`]) if (c && !taken(c)) return c;
  const base = last ? `${first}.${last}` : first; let n = 2; while (taken(base + n)) n++; return base + n;
}

function comboOpen(input, all) {

  const q = all ? "" : input.value.trim().toLowerCase();
  const opts = [...sel.options].filter(o => o.value && (!q || o.dataset.name.toLowerCase().includes(q) || o.dataset.user.toLowerCase().includes(q)));
  list.innerHTML = opts.length ? opts.map((o, i) => `<li role="option" id="${input.id}-o${o.value}" data-v="${o.value}" aria-selected="${i === 0 ? "true" : "false"}" class="${i === 0 ? "on" : ""}">
    <span>${h(o.dataset.name)}</span><span class="file-meta">${h(o.dataset.user)}${h(o.dataset.tag)}</span></li>`).join("") : `<li class="none">No one matches “${h(input.value.trim())}”.</li>`;
  list.hidden = false; input.setAttribute("aria-expanded", "true");
  const first = list.querySelector("[role=option]"); if (first) input.setAttribute("aria-activedescendant", first.id); else input.removeAttribute("aria-activedescendant");
}
function comboClose(input) { const list = input.closest(".combo").querySelector(".combo-list"); list.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); }
function comboPick(input, v) {

function wizGo(step) {

// Notifications: activity from the last 24 hours that this person is allowed to see, excluding their own actions.

function notifications(u) {

document.addEventListener("submit", e => {

        auth.username = (d.username || "").trim();

        if (doIt === "comment") { addComment(u, id, d.comment, internal); return {reopen: id}; }
        if (doIt === "approve") { accept(u, id, d.comment); flash("ok", `${reqCode(req(id))} approved and closed.`); break; }
        if (doIt === "extreq") { const res = requestExt(u, "req", id, d.extdate, d.extreason, d.extfield); flash("ok", res === "applied" ? "Date changed. The Timeline keeps the earlier date and your reason." : "Date change requested. The Project Lead or Project Head can now accept or decline it."); return {reopen: id}; }
        if (doIt === "fbreq") { requestFeedback(u, id, d.fbreason); flash("ok", "Feedback requested. The Project Head, Project Lead and Dev Lead can now accept it."); return {reopen: id}; }
        if (doIt === "fbaccept") { const to = decideFeedback(u, id, true, +d.fbstage, +d.fbto, d.fbnote); flash("ok", `Feedback request accepted. Sent to ${to} in ${STAGES[+d.fbstage]}.`); break; }
        if (doIt === "fbdecline") { const who = decideFeedback(u, id, false, 0, 0, d.fbnote); flash("ok", `Feedback request declined. It stays with ${who}.`); return {reopen: id}; }
        const st = +d.stage, to = proceed(u, id, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
        flash("ok", st === 8 ? "Approved. The requirement is Closed." : `Sent to ${to} in ${STAGES[st]}. They were emailed.`); break;
      }
      case "newreq": {
        const internal = d.internal === "yes", st = +d.stage, doIt = e.submitter && e.submitter.value;
        if (!d.title.trim()) throw new RuleError("Give the requirement a title.");
        if (doIt === "send" && isFeedback(st) && !d.comment.trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one.");
        const rid = createReq(u, pid, d.title, d.desc, d.due, d.priority, d.start);
        [...f.querySelectorAll("#nr-file-list li[data-name]")].forEach(li => upload(u, rid, li.dataset.name));
        [...f.querySelectorAll("#nr-link-list li[data-url]")].forEach(li => addLink(u, rid, li.dataset.url, li.dataset.label));
        if (doIt === "send") {
          const to = proceed(u, rid, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
          flash("ok", `Requirement ${reqCode(req(rid))} created and sent to ${to} in ${STAGES[st]}. They were emailed.`);
        } else {
          if (d.comment.trim()) addComment(u, rid, d.comment, internal);
          flash("ok", `Requirement ${reqCode(req(rid))} created. It is in your queue.`);
        }
        return {reopenProject: pid};
      }
      case "addmember": if (!+d.uid) throw new RuleError("Type a name and pick the person from the list.");
        addMember(u, pid, +d.uid, [...f.querySelectorAll(".np-role")].map(x => x.value)); flash("ok", "Saved. Roles updated."); return {reopenProject: pid};
      case "plan": setPlan(u, pid, d.priority, proj(pid).start); flash("ok", "Project priority saved."); return {reopenProject: pid, tab: "overview"};
      case "extreq": {
        const [kind, xid] = (d.item || "").split(":"), res = requestExt(u, kind, +xid, d.date, d.reason, d.field);
        flash("ok", res === "applied" ? "Date changed. The Timeline keeps the earlier date and your reason." : "Date change requested. The Project Lead or Project Head can now accept or decline it.");
        return {reopenProject: pid, tab: "overview"};
      }
      case "overview": submitOverview(u, pid, d); flash("ok", "Overview sent for approval. The Project Head or Project Lead approves it."); return {reopenProject: pid, tab: "overview"};
      case "ovdecide": { const ok = e.submitter && e.submitter.value === "accept"; decideOverview(u, pid, ok, d.note);
        flash("ok", ok ? "Overview approved. It is now read-only." : "Overview declined. It went back to the person who sent it."); return {reopenProject: pid, tab: "overview"}; }
      case "status": setStatus(u, pid, d.status, d.confirm === "yes"); flash("ok", d.status === "Closed" ? "Project closed. It is now in the Archive." : `Project status is now ${d.status}.`); return {reopenProject: pid};
      case "newproject": {
        const preq = +f.dataset.preq ? S.projReqs.find(x => x.id === +f.dataset.preq) : null;
        if (preq && preq.status !== "Pending") throw new RuleError("That project request was already handled or withdrawn.");
        const np = createProject(u, d.name, d.priority, d.deadline, d.start, d.type);
        if (preq) decideProjReq(u, preq.id, true, "", np);
        teamPicks(f).forEach(t => addMember(u, np, t.uid, t.roles));
        S.view = {name: "projects"}; flash("ok", `Project ${proj(np).code} created. Its folder was made on the share.`); return {reopenProject: np};
      }
      case "projreq": { const pr = requestProject(u, d); flash("ok", `Project request "${pr.name}" sent to the Project Head. Track it in Sent Requests.`); break; }
      case "prdecline": { decideProjReq(u, +f.dataset.id, false, d.note); flash("ok", "Project request declined. The requester was told why."); break; }
      case "access": {
        if (!isSysAdmin(u)) throw new Forbidden("Only the system admin changes access control.");
        S.access.requests = d.requests === "yes"; flash("ok", `Project requests are now ${S.access.requests ? "open" : "closed"}.`); break;
      }
      case "newrole": {
        if (!isSysAdmin(u)) throw new Forbidden("Only the system admin adds roles.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a role name.");
        if ([HEAD].concat(S.roles).some(r => r.toLowerCase() === n.toLowerCase())) throw new RuleError("That role already exists.");
        S.roles.push(n); syncLists(); flash("ok", `Role "${n}" added. It is now in every role dropdown.`); break;
      }
      case "newstage": {
        if (!isSysAdmin(u)) throw new Forbidden("Only the system admin adds stages.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a stage name.");
        if (S.stages.some(x => x.name.toLowerCase() === n.toLowerCase())) throw new RuleError("That stage already exists.");
        const id = Math.max(...S.stages.map(x => x.id)) + 1, folders = new Set(S.stages.map(x => x.folder)).size;
        const folder = `${String(folders + 1).padStart(2, "0")}_${clean(n, 40).replace(/ /g, "_")}`;
        S.stages.splice(S.stages.findIndex(x => x.id === 8), 0, {id, name: n, feedback: d.feedback === "yes", folder, cls: d.feedback === "yes" ? "st-fb" : "st-new"});
        syncLists(); flash("ok", `Stage "${n}" added. It is now in the Stage dropdown when sending.`); break;
      }
      case "newuser": {
        const un = genUsername(d.name || ""), cif = (d.cif || "").trim();
        if (!un) throw new RuleError("Enter the full name.");
        if (!/^\d+$/.test(cif)) throw new RuleError("CIF must be the ID number (digits only).");
        if (S.users.some(x => x.cif === cif)) throw new RuleError("Someone with that CIF is already a user.");
        if (!isSysAdmin(u)) throw new Forbidden("Only the system admin adds users.");
        if ((d.pw || "").length < 4) throw new RuleError("The temporary password needs at least 4 characters.");
        S.users.push({id: nextId("u"), username: un, name: d.name.trim(), cif, email: d.email.trim(), cto: false, pw: hashPw(d.pw), theme: "dark", font: "century", size: 2, bri: 3, con: 3});
        flash("ok", `User added. Username: ${un}.`); break;
      }
    }
  }, f);
});
// Top bar search: projects you can open, matched by code or name.
function topSearch(q) {
  const box = document.getElementById("top-q-results"), u = me(); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const first = (a, b) => (b.startsWith(q)) - (a.startsWith(q)) || a.localeCompare(b);
  const projects = S.projects.filter(p => canView(u, p.id) && (p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)))
    .sort((a, b) => first(a.code.toLowerCase(), b.code.toLowerCase())).slice(0, 5);
  const reqs = S.reqs.filter(r => canSeeReq(u, r) && (reqCode(r).toLowerCase().includes(q) || r.title.toLowerCase().includes(q)))
    .sort((a, b) => first(reqCode(a).toLowerCase(), reqCode(b).toLowerCase())).slice(0, 6);
  box.innerHTML = !projects.length && !reqs.length ? `<li class="none">Nothing matches “${h(q)}”. You only find projects you belong to and requirements you can open.</li>`
    : (projects.length ? `<li class="grp">Projects</li>` + projects.map(p => `<li><button type="button" data-go="project" data-id="${p.id}"><span class="code">${h(p.code)}</span><span class="pname">${h(p.name)}</span>${label(p.status, p.status === "Active" ? "st-ap" : "st-cl")}</button></li>`).join("") : "")
    + (reqs.length ? `<li class="grp">Requirements</li>` + reqs.map(r => `<li><button type="button" data-act="open-card" data-id="${r.id}"><span class="code">${h(reqCode(r))}</span><span class="pname">${h(r.title)}</span>${stageLabel(r.stage)}</button></li>`).join("") : "");
  box.hidden = false;
}
document.addEventListener("keydown", e => {
  if (e.target.id !== "top-q") return;
  if (e.key === "Enter") { e.preventDefault(); const b = document.querySelector("#top-q-results button"); if (b) b.click(); }
  if (e.key === "Escape") { e.target.value = ""; topSearch(""); }
  if (e.key === "ArrowDown") { const b = document.querySelector("#top-q-results button"); if (b) { e.preventDefault(); b.focus(); } }
});
document.addEventListener("click", e => { if (!e.target.closest(".tsearch")) { const box = document.getElementById("top-q-results"); if (box) box.hidden = true; } });
document.addEventListener("input", e => {
  if (e.target.id === "pref-bri") {   // live preview; Save settings keeps it
    document.getElementById("pref-bri-v").textContent = `${e.target.value} of 5`; setLight(+e.target.value, 3); return;
  }
  if (e.target.name === "accent") { document.documentElement.dataset.accent = e.target.value; return; }   // live preview
  if (e.target.id === "top-q") { topSearch(e.target.value); return; }
  if (e.target.matches(".combo input")) { e.target.closest(".combo").querySelector("select").value = ""; comboOpen(e.target, false); return; }
  if (e.target.id === "nu-name") { document.getElementById("nu-username").value = genUsername(e.target.value); return; }
  if (e.target.id === "arc-q") {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll("details.arc").forEach(d => { const on = !q || d.dataset.q.includes(q); d.hidden = !on; if (on) shown++; if (q && on) d.open = true; });
    document.querySelectorAll("tr.arc-row").forEach(tr => { if (tr.closest("details.arc")) return; const on = !q || tr.dataset.q.includes(q); tr.hidden = !on; if (on) shown++; });
    document.getElementById("arc-none").hidden = shown > 0;
  }
  if (e.target.id === "np-name" || e.target.id === "np-type") {
    const c = genCode(document.getElementById("np-type").value); document.getElementById("np-code").textContent = c;
    document.getElementById("np-folder").textContent = `${fileRoot()}\\${c}`;
  }
});
// Dummy files: a name only, for trying the flow without real files.
function addLinkUi(btn) {
  const isNew = btn.dataset.act === "add-link-new", pre = isNew ? "nr-link" : "cd-link", err = modal.querySelector("#modal-error");
  const urlIn = document.getElementById(pre + "-url"), labelIn = document.getElementById(pre + "-label");
  if (isNew) {
    let url; try { url = cleanUrl(urlIn.value); } catch (e) { err.textContent = "Cannot do that: " + e.message; err.hidden = false; urlIn.focus(); return; }
    err.hidden = true;
    const list = document.getElementById("nr-link-list"), note = list.querySelector("li.note"); if (note) note.remove();
    if (list.querySelector(`li[data-url="${CSS.escape(url)}"]`)) { err.textContent = "Cannot do that: That link is already added."; err.hidden = false; return; }
    list.insertAdjacentHTML("beforeend", linkRow({url, label: labelIn.value.trim()}, `<button type="button" class="linkish" data-act="drop-dummy">Remove</button>`)
      .replace('<li class="file">', `<li class="file" data-url="${h(url)}" data-label="${h(labelIn.value.trim())}">`));
    urlIn.value = ""; labelIn.value = ""; urlIn.focus(); return;
  }
  const rid = +btn.dataset.rid, keep = (document.getElementById("cd-comment") || {}).value;
  run(() => { addLink(me(), rid, urlIn.value, labelIn.value); flash("ok", "Link added."); return {reopen: rid, comment: keep}; }, btn.closest("form"));
}
function addDummy(btn) {
  const isNew = btn.dataset.act === "add-dummy-new", input = document.getElementById(isNew ? "nr-dummy" : "cd-dummy");
  const name = input.value.trim(), err = modal.querySelector("#modal-error");
  if (!name) { err.textContent = "Cannot do that: type a file name first, for example test_plan.xlsx."; err.hidden = false; input.focus(); return; }
  err.hidden = true;
  if (isNew) {
    const list = document.getElementById("nr-file-list"), note = list.querySelector("li.note"); if (note) note.remove();
    list.insertAdjacentHTML("beforeend", `<li class="file" data-name="${h(name)}"><span class="ext" aria-hidden="true">${extOf(name)}</span><span class="file-main"><span class="file-name">${h(name)}</span><span class="file-meta">Dummy file · added when you press Send or Keep it with me</span></span><button type="button" class="linkish" data-act="drop-dummy">Remove</button></li>`);
    input.value = ""; input.focus(); return;
  }
  const rid = +btn.dataset.rid, keep = (document.getElementById("cd-comment") || {}).value;
  run(() => { const saved = upload(me(), rid, name); flash("ok", `Dummy file ${saved} added.`); return {reopen: rid, comment: keep}; }, btn.closest("form"));
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && ["cd-dummy", "nr-dummy", "cd-link-url", "cd-link-label", "nr-link-url", "nr-link-label"].includes(e.target.id)) {
    e.preventDefault(); e.target.closest(".row").querySelector("button").click();
  }
});
function run(fn, form) {
  const inModal = !!(form && modal.contains(form));
  let res;
  try { res = fn(); } catch (err) {
    if (!(err instanceof Forbidden || err instanceof RuleError)) throw err;
    const msg = (err instanceof Forbidden ? "Not allowed: " : "Cannot do that: ") + err.message;
    if (inModal) { const el = modal.querySelector("#modal-error"); el.textContent = msg; el.hidden = false; el.scrollIntoView({block: "nearest"}); return; }
    flash("error", msg);
  }
  if (res && res.reopen) { render(); reqCard(res.reopen, res.comment); return; }
  if (res && res.reopenProject) { render(); projectCard(res.reopenProject, res.tab); return; }
  if (inModal) closeModal();
  render();
  if (S.flash && S.flash.type === "error") window.scrollTo(0, 0);
}
document.getElementById("as-user").addEventListener("change", e => {
  if (!e.target.value) return;
  S.me = +e.target.value; const u = me(); calDay = null; calYM = null; auth = {step: "login", username: ""};
  if (isSysAdmin(u)) { S.view = {name: "admin"}; flash("ok", "Now signed in as the system admin (Admin page only)."); render(); return; }
  if (S.view.name === "admin" || (S.view.name === "paused" && !u.cto) || S.view.name === "notifications") S.view = {name: "queue"};
  flash("ok", `Now viewing as ${u.name}${u.cto ? " (CTO)" : ""}. Roles: ${S.projects.filter(p => role(p.id, u.id)).map(p => `${p.code} ${role(p.id, u.id)}`).join(", ") || (u.cto ? "CTO on all projects" : "none")}.`);
  render();
});
const rc = document.getElementById("reset-confirm"), rb = document.getElementById("reset-demo");
rb.addEventListener("click", () => { rc.hidden = false; rb.hidden = true; });
document.getElementById("reset-no").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; });
document.getElementById("reset-yes").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; const keep = {roles: S.roles, stages: S.stages}, who = S.me && user(S.me) ? user(S.me).username : null; seed(); Object.assign(S, keep); syncLists();
  if (who) { const x = S.users.find(y => y.username === who); S.me = x ? x.id : null; }
  flash("ok", "Sample data restored. Roles and stages you added were kept."); render(); });

if (!load()) seed();
syncLists();
S.reqs.forEach(r => { if (!r.holders) r.holders = r.holder ? [r.holder] : []; delete r.holder; });
S.projects.forEach(p => S.reqs.filter(r => r.pid === p.id).sort((a, b) => a.id - b.id).forEach((r, i) => { if (!r.code) r.code = `${p.code}-R${String(i + 1).padStart(2, "0")}`; }));
S.projects.forEach(p => { if (!p.type) p.type = "Internal"; });
S.projects.forEach(p => { if (!p.deadlines) p.deadlines = p.deadline ? [p.deadline] : []; if (!p.overview) p.overview = {}; });
S.reqs.forEach(r => { if (!r.dues) r.dues = r.due ? [r.due] : []; if (!r.fbReqs) r.fbReqs = []; });
if (S.view && S.view.name === "project") S.view = {name: "projects"};
S.projects.forEach(p => p.members.forEach(m => { if (!m.roles) { m.roles = [m.role]; delete m.role; } }));
if (!S.iosDefault) { S.iosDefault = true; }
if (!S.reminders) seedOrganizer();
ensureAuthData();
if (!S.authV) { S.me = null; S.authV = 1; S.flash = null; }   // everyone starts at the sign-in page once
if (!S.cgDefault) { S.users.forEach(x => { if (!x.font || x.font === "system") x.font = "century"; }); S.cgDefault = true; }
if (!S.darkDefault) { S.users.forEach(x => { x.theme = "dark"; }); S.darkDefault = true; }
if (me()) S.flash = S.flash || {type: "ok", text: S.projects.length ? `You are viewing as ${me().name}. Use "Quick switch" above to try another person.`
  : `No projects yet. You are viewing as ${me().name} (CTO): press New project to start. Use "Quick switch" above to try another person.`};
render();
</script>
