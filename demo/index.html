html { font-size: var(--size); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.47;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 64rem; margin: 0 auto; padding-block: 1.25rem 3rem; }
h1 { font-size: 2.125rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: .25rem 0 1rem; text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; margin: 1.75rem 0 .6rem; text-wrap: balance; }
a, .linkish { color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; text-decoration: none; }
.linkish:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Demo strip */
.demo { background: var(--demo); font-size: .85rem; border-bottom: 1px solid var(--sep); }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-block: .4rem; }
.demo-in strong { letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; }
.demo select { min-height: 2rem; padding: .15em .6em; }
.demo .btn { min-height: 2rem; padding: .25em .9em; font-size: .85rem; }

/* Navigation bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--sep); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding-block: .55rem; max-width: 64rem; margin: 0 auto; box-sizing: content-box; }
.topbar-in > strong { font-size: 1.05rem; letter-spacing: -.02em; }
.topbar nav { display: flex; flex-wrap: wrap; gap: .25rem; flex: 1; }
.topbar nav button { font-weight: 600; padding: .35rem .85rem; border-radius: 999px; }
.topbar nav button:hover { text-decoration: none; background: var(--tint); }
.topbar nav button[aria-current="page"] { background: var(--tint); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; padding: .4rem .95rem; border-radius: 999px; background: var(--tint); color: var(--accent); font-weight: 600; }
.menu summary::-webkit-details-marker { display: none; }
.menu-body { position: absolute; right: 0; z-index: 25; width: min(19rem, calc(100vw - 32px)); margin-top: .5rem; padding: 1rem;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: grid; gap: .9rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; font-size: .95rem; padding: 0 0 .35rem; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: .6rem; }
.seg { display: block; text-align: center; padding: .4rem .5rem; border-radius: .5rem; font-weight: 600; font-size: .9rem; cursor: pointer; }
.seg:has(input:checked) { background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .22); }
.seg:has(input:focus-visible) { outline: 3px solid var(--accent); }

/* Buttons */
.btn { font: inherit; font-size: 1rem; font-weight: 600; padding: .55em 1.25em; border-radius: 999px; cursor: pointer; border: 0;
  min-height: 2.75rem; letter-spacing: -.01em; transition: transform .12s ease, filter .12s ease; }
.btn.primary { background: var(--btn); color: var(--on-btn); }
.btn.secondary { background: var(--tint); color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }

/* Form controls */
label { display: grid; gap: .3rem; font-weight: 600; font-size: .95rem; }
input, select, textarea { font: inherit; font-size: 1rem; max-width: 100%; min-height: 2.75rem; border-radius: var(--radius-sm); }
select, input[type="date"], input[type="number"] { color: var(--text); background: var(--surface-2); border: 1px solid var(--sep-strong); padding: .45em .6em; }
/* Text boxes are inverted panels with a metal rim: dark in Light mode, bright in Dark mode. */
textarea, input:not([type]), input[type="text"], input[type="email"], input[type="url"] {
  color: var(--inv-fg); caret-color: var(--inv-link); padding: .55em .8em; border: 2px solid transparent;
  background: linear-gradient(var(--inv-bg), var(--inv-bg)) padding-box, var(--metal) border-box; }
textarea { width: 100%; resize: vertical; }
textarea::placeholder, input::placeholder { color: var(--inv-muted); opacity: 1; }
/* iOS switch for checkboxes */
label.check { display: flex; align-items: center; gap: .7rem; font-weight: 500; }
label.check input[type="checkbox"] { -webkit-appearance: none; appearance: none; flex: none; width: 3.1rem; height: 1.9rem; min-height: 0;
  margin: 0; border: 0; border-radius: 999px; background: var(--switch-off); position: relative; cursor: pointer; transition: background .2s; }
label.check input[type="checkbox"]::before { content: ""; position: absolute; top: .15rem; left: .15rem; width: 1.6rem; height: 1.6rem;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .2s; }
label.check input[type="checkbox"]:checked { background: var(--switch-on); }
label.check input[type="checkbox"]:checked::before { transform: translateX(1.2rem); }
.stack { display: grid; gap: .85rem; }
.stack > .btn { justify-self: start; }
.narrow { max-width: 24rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: .75rem 0; }
.row > label { min-width: 0; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
.head-row h1, .head-row h2 { margin-block: .5rem; }

/* Grouped lists */
.tbl { overflow-x: auto; margin: .5rem 0 1.25rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--card-shadow); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .7rem .9rem; vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--sep); }
tbody tr + tr td { border-top: 1px solid var(--sep); }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .linkish { font-weight: 600; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 1.1rem; margin: var(--space) 0; box-shadow: var(--card-shadow); }
.panel > h2:first-child { margin-top: 0; }
summary { cursor: pointer; font-weight: 600; }
.pre { white-space: pre-wrap; }
.note { color: var(--muted); margin: 0; font-size: .9rem; }
.flash { border-radius: var(--radius); padding: .75rem 1rem; margin-bottom: 1rem; font-weight: 600; background: var(--surface);
  box-shadow: var(--card-shadow), inset 4px 0 0 currentColor; }
.flash.error { color: var(--error); }
.flash.ok { color: var(--ok); }
.history { padding-left: 1.5rem; margin: 0; }
.history li { margin-bottom: .5rem; }
.history strong { font-weight: 600; }
blockquote { margin: .3rem 0 0; padding-left: .75rem; border-left: 3px solid var(--sep-strong); }
code { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }
.crumb { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .3rem 1rem; margin: 0; }
.kv dt { font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; }
.stage-list { margin: .25rem 0 .75rem; padding-left: 1.75rem; display: grid; gap: .4rem; }
.team-row.wiz { display: grid; grid-template-columns: minmax(8rem, 11rem) minmax(0, 1fr) auto; gap: .75rem; align-items: start;
  padding-bottom: .85rem; border-bottom: 1px solid var(--sep); }
.team-row.wiz > .btn { margin-top: 1.75rem; }
@media (max-width: 40rem) { .team-row.wiz { grid-template-columns: 1fr; } .team-row.wiz > .btn { justify-self: start; margin-top: 0; } }
.role-picks { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
.role-extra { display: flex; gap: .5rem; align-items: end; }
.role-extra .linkish, .add-role { padding-bottom: .7rem; font-weight: 600; white-space: nowrap; }
.chip-x { background: none; border: 0; color: inherit; font: inherit; font-weight: 700; cursor: pointer; margin-left: .35rem; padding: 0 .15rem; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 .75rem; }

/* Chips: stage family, priority, comment type */
.label { display: inline-block; padding: .1rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--sep-strong); }
.label.st-an, .label.pr-normal { background: var(--an-bg); color: var(--an-fg); border-color: currentColor; }
.label.st-dev { background: var(--dev-bg); color: var(--dev-fg); border-color: currentColor; }
.label.st-qa { background: var(--qa-bg); color: var(--qa-fg); border-color: currentColor; }
.label.st-ap { background: var(--ap-bg); color: var(--ap-fg); border-color: currentColor; }
.label.st-fb, .label.pr-high { background: var(--fb-bg); color: var(--fb-fg); border-color: currentColor; }
.label.st-cl, .label.pr-low { background: var(--cl-bg); color: var(--cl-fg); border-color: currentColor; }
.label.st-new { background: var(--new-bg); color: var(--new-fg); border-color: currentColor; }
.label.tag-int { background: var(--int); color: var(--bg); border-color: var(--int); }
.label.tag-sh { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }

/* Sheets (popup cards) */
dialog.card { border: 0; border-radius: 1.1rem; padding: 0; width: min(46rem, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  background: var(--bg); color: var(--text); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .45); }
dialog.card[open] { display: flex; flex-direction: column; }
dialog.card > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
dialog.card::backdrop { background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .85rem 1.1rem; flex: none;
  background: var(--glass); border-bottom: 1px solid var(--sep); }
.card-head h2 { margin: 0; font-size: 1.1rem; }
.card-phases { padding: .85rem 1.1rem 0; flex: none; }
.card-body { padding: 1rem 1.1rem; display: grid; gap: .85rem; overflow-y: auto; min-height: 0; }
.card-body > * { min-width: 0; }
.card-foot { flex: none; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: flex-end; padding: .85rem 1.1rem;
  background: var(--glass); border-top: 1px solid var(--sep); }
.card-foot .spacer { flex: 1; }
.x { font: inherit; font-size: 1rem; line-height: 1; width: 2rem; height: 2rem; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface-2); color: var(--text); display: grid; place-items: center; }
.card-section { background: var(--surface); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--card-shadow); }
.fl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .3rem; }
.title-view { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; margin: 0; text-wrap: balance; }
.meta { margin: .45rem 0 0; display: flex; flex-wrap: wrap; gap: .35rem .75rem; align-items: center; }

<script>
"use strict";
// Stages and roles live in the data so the CTO can add new ones in Admin. Closed (id 8) always stays last.
const DEFAULT_STAGES = [
  {id: 1, name: "Analysis", feedback: false, folder: "01_Analysis", cls: "st-an"},
  {id: 2, name: "Analysis Feedback", feedback: true, folder: "01_Analysis", cls: "st-fb"},
  {id: 3, name: "Development", feedback: false, folder: "02_Development", cls: "st-dev"},
  {id: 4, name: "Development Feedback", feedback: true, folder: "02_Development", cls: "st-fb"},
  {id: 5, name: "QA", feedback: false, folder: "03_QA", cls: "st-qa"},
  {id: 6, name: "QA Feedback", feedback: true, folder: "03_QA", cls: "st-fb"},
  {id: 7, name: "Approval", feedback: false, folder: "04_Approval", cls: "st-ap"},
  {id: 8, name: "Closed", feedback: false, folder: "04_Approval", cls: "st-cl"}];
const DEFAULT_ROLES = ["Project Lead", "Dev Lead", "Project Analyst", "Business Stakeholder", "Developer", "QA"];
let STAGES = {}, ROLES = [];
function syncLists() {
  if (!S.stages) S.stages = DEFAULT_STAGES.map(x => ({...x}));
  if (!S.roles) S.roles = DEFAULT_ROLES.slice();
  STAGES = Object.fromEntries(S.stages.map(x => [x.id, x.name])); ROLES = S.roles;
}
const stageInfo = n => S.stages.find(x => x.id === n) || {};
const isFeedback = n => !!stageInfo(n).feedback;
const stageOrder = () => S.stages.map(x => x.id);
const stageFolder = n => stageInfo(n).folder;
const STATUSES = ["Active", "On Hold", "Cancelled", "Closed"];
const PAUSED = ["On Hold", "Cancelled"];
const PRIORITIES = ["Low", "Normal", "High"];
const CREATORS = ["Business Stakeholder", "Project Analyst", "Project Lead", "Dev Lead"];
const LEADS = ["Project Lead", "Dev Lead"];
const SH = "Business Stakeholder", AN = "Project Analyst";
const FILE_ROOT = "\\\\fs01\\IDLC_Streams";
const DAY = 864e5;
const KEY = "pmt-demo-v5";
const HEAD = "Project Head";

let S, CLOCK = null;
const now = () => CLOCK ?? Date.now();

// ---------- helpers ----------
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = t => { const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const isoDay = t => fmt(t).slice(0, 10);
const label = (t, cls = "") => `<span class="label ${cls}">${h(t)}</span>`;
const stageLabel = n => label(STAGES[n], stageInfo(n).cls);
const priLabel = p => label(p, "pr-" + p.split(" ")[0].toLowerCase());
const extOf = n => { const i = n.lastIndexOf("."); return (i > 0 ? n.slice(i + 1, i + 5) : "file").toUpperCase(); };
const user = id => S.users.find(u => u.id === id);
const uname = id => (user(id) || {}).name || "None";
const me = () => user(S.me);
const proj = id => S.projects.find(p => p.id === id);
const req = id => S.reqs.find(r => r.id === id);
// A member can hold several roles in one project.
const rolesOf = (pid, uid) => ((proj(pid)?.members || []).find(m => m.uid === uid) || {}).roles || [];
const has = (pid, uid, r) => rolesOf(pid, uid).includes(r);
const role = (pid, uid) => rolesOf(pid, uid).join(", ") || null;
const isLead = (pid, uid) => rolesOf(pid, uid).some(r => LEADS.includes(r));
const canView = (u, pid) => u.cto || !!role(pid, u.id);
// The CTO everywhere, and the Project Lead inside their own project, have the same powers.
const isHead = (u, pid) => u.cto || has(pid, u.id, "Project Lead");
const nextId = k => (S.seq[k] = (S.seq[k] || 0) + 1);

class Forbidden extends Error {}

function require_(u, ok, msg, pid) { if (ok) return false; if (isHead(u, pid)) return true; throw new Forbidden(msg); }
function log(pid, u, action, o = {}) {
  S.history.push({id: nextId("h"), pid, rid: o.rid ?? null, uid: u.id, at: now(), action: action + (o.override ? (u.cto ? " (CTO override)" : " (Project Lead override)") : ""),
    from: o.from ?? null, to: o.to ?? null, fromStage: o.fromStage ?? null, toStage: o.toStage ?? null,
    comment: (o.comment || "").trim(), internal: !!o.internal, override: !!o.override});
}
const stakeholderView = (u, pid) => !isHead(u, pid) && has(pid, u.id, SH);

// ---------- projects & members ----------
// Code = initials of the name (up to 4) + running number, e.g. "Customer Portal Revamp" -> CPR-001.
function genCode(name) {
  const ini = (name || "").split(/[^A-Za-z0-9]+/).filter(Boolean).map(w => w[0].toUpperCase()).join("").slice(0, 4) || "PRJ";
  return `${ini}-${String((S.seq.p || 0) + 1).padStart(3, "0")}`;
}
function checkDates(start, end, endName) {
  if (start && end && start > end) throw new RuleError(`The start date must be on or before the ${endName}.`);
}
function createProject(u, name, priority = "Normal", deadline = "", start = "") {
  if (!u.cto) throw new Forbidden("Only the CTO creates projects.");
  name = name.trim(); if (!name) throw new RuleError("Give the project a name.");
  if (!PRIORITIES.includes(priority)) throw new RuleError("Choose a priority.");
  checkDates(start, deadline, "deadline");
  const code = genCode(name);
  const p = {id: nextId("p"), name, code, status: "Active", pausedAt: null, folder: `${FILE_ROOT}\\${code}`, priority, deadline: deadline || null, start: start || null,
    members: S.users.filter(x => x.cto).map(x => ({uid: x.id, roles: [HEAD]}))};
  S.projects.push(p); log(p.id, u, `Project created with code ${code}`); return p.id;
}
// Project priority and deadline: the CTO, the Project Lead and the Dev Lead can set or change them.
const canPlan = (u, pid) => isHead(u, pid) || has(pid, u.id, "Dev Lead");
function setPlan(u, pid, priority, deadline, start) {
  if (!canPlan(u, pid)) throw new Forbidden("Only the CTO, the Project Lead or the Dev Lead change the project priority and dates.");
  if (!PRIORITIES.includes(priority)) throw new RuleError("Choose a priority.");
  const p = proj(pid), oldP = p.priority || "Normal", oldD = p.deadline || null, oldS = p.start || null;
  deadline = deadline || null; start = start || null;
  checkDates(start, deadline, "deadline");
  if (priority === oldP && deadline === oldD && start === oldS) throw new RuleError("Nothing changed.");
  if (start !== oldS) log(pid, u, start ? (oldS ? `Project start changed: ${oldS} to ${start}` : `Project start set: ${start}`) : `Project start removed (was ${oldS})`);
  if (priority !== oldP) log(pid, u, `Project priority changed: ${oldP} to ${priority}`);
  if (deadline !== oldD) log(pid, u, deadline ? (oldD ? `Project deadline changed: ${oldD} to ${deadline}` : `Project deadline set: ${deadline}`) : `Project deadline removed (was ${oldD})`);
  p.priority = priority; p.deadline = deadline; p.start = start;
}
const overdue = p => p.deadline && p.status === "Active" && p.deadline < isoDay(now());
const deadlineText = p => p.deadline ? `${p.deadline}${overdue(p) ? " " + label("Overdue", "st-fb") : ""}` : `<span class="note">None</span>`;
// Member rules: Stakeholders are managed by the CTO or Project Lead; Project Lead and Dev Lead roles can be removed only by the CTO.
function canAddRole(u, pid, r) { return r === SH ? isHead(u, pid) : isHead(u, pid) || isLead(pid, u.id); }
function canRemoveRole(u, pid, r) { if (r === HEAD) return false; if (LEADS.includes(r)) return !!u.cto; return canAddRole(u, pid, r); }
const removeWhy = r => r === HEAD ? "The Project Head is in every project and cannot be removed."
  : LEADS.includes(r) ? "Only the CTO can remove a Project Lead or Dev Lead."
  : r === SH ? "Only the CTO or the Project Lead manage Business Stakeholders." : "Only the CTO, Project Lead or Dev Lead manage members.";
function addMember(u, pid, uid, roles) {
  roles = [...new Set([].concat(roles))].filter(Boolean);
  if (!roles.length) throw new RuleError("Choose at least one role.");
  roles.forEach(r => {
    if (!ROLES.includes(r)) throw new RuleError("Unknown role.");
    if (!canAddRole(u, pid, r)) throw new Forbidden(r === SH ? "Only the CTO or the Project Lead add Business Stakeholders." : "Only the CTO, Project Lead or Dev Lead manage members.");
  });
  const p = proj(pid); let m = p.members.find(x => x.uid === uid);
  if (m && m.roles.includes(HEAD)) throw new RuleError("The Project Head already has full access.");
  const fresh = roles.filter(r => !(m && m.roles.includes(r)));
  if (!fresh.length) throw new RuleError(`${uname(uid)} already has ${roles.length > 1 ? "these roles" : "that role"}.`);
  const isNew = !m; if (isNew) { m = {uid, roles: []}; p.members.push(m); }
  m.roles.push(...fresh);
  log(pid, u, isNew ? `Added member as ${fresh.join(", ")}` : `Added role ${fresh.join(", ")}`, {to: uid});
}
function checkNotHolding(pid, uid) {
  if (S.reqs.some(x => x.pid === pid && holds(x, uid) && x.stage !== 8)) throw new RuleError(`${uname(uid)} holds open requirements. Send them on first.`);
}
function removeRole(u, pid, uid, r) {
  if (!has(pid, uid, r)) throw new RuleError("That person does not have that role.");
  if (!canRemoveRole(u, pid, r)) throw new Forbidden(removeWhy(r));
  const p = proj(pid), m = p.members.find(x => x.uid === uid);
  if (m.roles.length === 1) { checkNotHolding(pid, uid); p.members = p.members.filter(x => x.uid !== uid); log(pid, u, `Removed member (${r})`, {from: uid}); return; }
  m.roles = m.roles.filter(x => x !== r); log(pid, u, `Removed role ${r}`, {from: uid});
}
function removeMember(u, pid, uid) {
  const rs = rolesOf(pid, uid); if (!rs.length) throw new RuleError("That person is not a member.");
  rs.forEach(r => { if (!canRemoveRole(u, pid, r)) throw new Forbidden(removeWhy(r)); });
  checkNotHolding(pid, uid);
  const p = proj(pid); p.members = p.members.filter(m => m.uid !== uid); log(pid, u, `Removed member (${rs.join(", ")})`, {from: uid});
}
function setStatus(u, pid, status, confirm) {
  if (!isHead(u, pid)) throw new Forbidden("Only the CTO or the Project Lead change project status.");
  const p = proj(pid); if (status === p.status) return;
  if (status === "Closed") {
    if (S.reqs.some(r => r.pid === pid && r.stage !== 8)) throw new RuleError("All requirements must be Closed before the project can close.");
    if (!confirm) throw new RuleError("Tick the confirmation box to close the project.");
  }
  const t = now();
  if (PAUSED.includes(status) && !PAUSED.includes(p.status)) p.pausedAt = t;
  else if (!PAUSED.includes(status) && PAUSED.includes(p.status)) {
    const delta = p.pausedAt ? t - p.pausedAt : 0;
    S.reqs.filter(r => r.pid === pid && r.stage !== 8).forEach(r => { r.entered += delta; });
    p.pausedAt = null;
  }
  log(pid, u, `Status changed: ${p.status} to ${status}`); p.status = status;
}

// ---------- requirements & actions ----------
function createReq(u, pid, title, desc, due, priority, start) {
  const p = proj(pid); if (!canView(u, pid)) throw new Forbidden("You are not a member of this project.");
  title = title.trim(); if (!title) throw new RuleError("Title is required.");
  let ov = require_(u, u.cto || rolesOf(pid, u.id).some(r => CREATORS.includes(r)), "Only Stakeholders, Analysts, Project Leads, Dev Leads or the CTO create requirements.", pid);
  ov = require_(u, p.status === "Active", `Project is ${p.status}; no new requirements.`, pid) || ov;
  checkDates(start, due, "due date");
  const id = nextId("r"), t = now();
  S.reqs.push({id, pid, title, desc: desc.trim(), stage: 1, holders: [u.id], prev: null, prevStage: null, due: due || null, start: start || null,
    priority, feedback: false, createdBy: u.id, entered: t, created: t, folder: `${p.folder}\\${id}_${clean(title, 50).replace(/ /g, "_")}`});
  log(pid, u, "Created requirement", {rid: id, to: u.id, toStage: 1, override: ov});
  return id;
}
function guard(u, r) {
  if (r.stage === 8) throw new RuleError("This requirement is Closed.");
  const st = proj(r.pid).status;
  let ov = require_(u, st === "Active", `Project is ${st}; actions are blocked.`, r.pid);
  return require_(u, holds(r, u.id), "Only the people the requirement is assigned to can act on it.", r.pid) || ov;
}
function memberRole(pid, uid) { const r = role(pid, uid); if (!r) throw new RuleError("Choose a project member to send to."); return r; }
function needComment(c) { if (!(c || "").trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one."); }
function move(u, r, action, to, toStage, comment, internal, ov, setPrev = true) {
  if (stakeholderView(u, r.pid)) internal = false;
  const fromList = holdersOf(r).slice(), fromStage = r.stage, toList = to ? [].concat(to) : [];
  const before = {prev: r.prev, prevStage: r.prevStage, entered: r.entered};
  if (toStage !== r.stage) r.entered = now();
  if (setPrev) { r.prev = u.id; r.prevStage = fromStage; }
  r.stage = toStage; r.holders = toList;
  log(r.pid, u, action, {rid: r.id, from: fromList[0], to: toList[0], fromStage, toStage, comment, internal, override: ov});
  const hx = S.history[S.history.length - 1]; hx.fromList = fromList; hx.toList = toList; hx.before = before;
  return toList.map(t => handoff(u, r, action, t, (comment || "").trim(), internal)).join(", ");
}
// Sent requests: a sender can unsend while the requirement has not moved again since their send.
const MOVE = /^(Send|Reassign|Accepted and closed|Unsent)\b/;
const lastMove = rid => S.history.filter(x => x.rid === rid && MOVE.test(x.action)).pop();
const isSend = x => x.rid && /^Send\b/.test(x.action);
const canUnsend = (u, x) => { const r = req(x.rid); return !!r && isSend(x) && x.uid === u.id && !x.unsent && lastMove(x.rid) === x && proj(r.pid).status === "Active"; };
function unsend(u, hid) {
  const x = S.history.find(y => y.id === hid);
  if (!x || x.uid !== u.id || !isSend(x)) throw new Forbidden("You can only unsend requirements you sent.");
  const r = req(x.rid), st = proj(r.pid).status;
  if (x.unsent) throw new RuleError("This send was already undone.");
  if (lastMove(x.rid) !== x) throw new RuleError("It has already been sent on by the person who received it, so it cannot be unsent.");
  if (st !== "Active") throw new RuleError(`Project is ${st}; nothing can be changed.`);
  const recips = holdersOf(r).slice(), back = (x.fromList || [x.from]).filter(Boolean);
  r.stage = x.fromStage; r.holders = back.length ? back : [u.id];
  if (x.before) { r.prev = x.before.prev; r.prevStage = x.before.prevStage; r.entered = x.before.entered; }
  x.unsent = true;
  log(r.pid, u, "Unsent", {rid: r.id, from: recips[0], to: r.holders[0], fromStage: x.toStage, toStage: x.fromStage});
  const hx = S.history[S.history.length - 1]; hx.fromList = recips; hx.toList = r.holders.slice();
  const p = proj(r.pid);
  recips.forEach(t => S.outbox.unshift({at: now(), to: (user(t) || {}).email, subject: `[IDLC Streams ${p.code}] #${r.id} ${r.title}: Unsent`,
    body: `${u.name} took back requirement #${r.id} ${r.title}. It was sent to you by mistake; no action is needed.`}));
  return {names: recips.map(uname).join(", "), title: r.title, stage: STAGES[r.stage]};
}
// A requirement can be assigned to several people at once; any of them can work on it and send it on.
const holdersOf = r => r.holders || [];
const holds = (r, uid) => holdersOf(r).includes(uid);
const holderNames = r => holdersOf(r).map(uname).join(", ") || "None";
// Only the Project Head (CTO), Project Lead and Dev Lead see every requirement in a project; everyone else sees only what they hold.
const seesAll = (u, pid) => isHead(u, pid) || has(pid, u.id, "Dev Lead");
// Someone "worked on" a requirement if they created it, acted on it, or it was ever assigned to them.
const involved = (r, uid) => r.createdBy === uid || S.history.some(x => x.rid === r.id && (x.uid === uid || (x.toList || [x.to]).includes(uid)));

  to = [...new Set([].concat(to).filter(Boolean))];
  if (!to.length) throw new RuleError("Choose at least one person to send to.");

function accept(u, id, comment) {
  const r = loadReq(u, id); let ov = guard(u, r);
  ov = require_(u, r.stage === 7 && has(r.pid, u.id, SH), "Only the Business Stakeholder can close it, from Approval.", r.pid) || ov;
  return move(u, r, "Accepted and closed", null, 8, comment, false, ov);
}
function reassign(u, id, to, comment) {
  const r = loadReq(u, id); if (r.stage === 8) throw new RuleError("This requirement is Closed.");
  const st = proj(r.pid).status;
  let ov = require_(u, st === "Active", `Project is ${st}; actions are blocked.`, r.pid);
  ov = require_(u, isLead(r.pid, u.id), "Only the Project Lead or Dev Lead can reassign.", r.pid) || ov;
  memberRole(r.pid, to);
  return move(u, r, "Reassign", [to], r.stage, comment, false, ov, false);
}
function addComment(u, id, text, internal) {
  const r = loadReq(u, id); text = (text || "").trim(); if (!text) throw new RuleError("Write a comment first.");
  if (stakeholderView(u, r.pid)) internal = false;
  S.comments.push({id: nextId("c"), rid: id, uid: u.id, at: now(), text, internal: !!internal});
}
function upload(u, id, filename) {
  const r = loadReq(u, id); const st = proj(r.pid).status;
  const ov = require_(u, st === "Active", `Project is ${st}; uploads are blocked.`, r.pid);
  const folder = stageFolder(r.stage);
  const base0 = clean(filename.split(/[\\/]/).pop(), 80), dot = base0.lastIndexOf(".");
  const base = dot > 0 ? base0.slice(0, dot) : base0, ext = dot > 0 ? base0.slice(dot) : "";
  const taken = new Set(S.files.filter(f => f.rid === id && f.folder === folder).map(f => f.name));
  let name = base0, n = 1; while (taken.has(name)) name = `${base}_v${++n}${ext}`;
  S.files.push({id: nextId("f"), rid: id, stage: r.stage, folder, name, uid: u.id, at: now()});
  log(r.pid, u, `Uploaded ${name}`, {rid: id, override: ov});
  return name;
}

// Repository / reference links: a URL plus an optional label, kept with the requirement.
function cleanUrl(url) {
  url = (url || "").trim(); if (url && !/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = "https://" + url;
  let ok = false; try { const x = new URL(url); ok = (x.protocol === "https:" || x.protocol === "http:") && !/\s/.test(url) && /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(x.hostname); } catch (e) {}
  if (!ok) throw new RuleError("Type a full web address, for example https://github.com/team/repo.");
  return url;
}
const linkKind = url => /github\.com|gitlab|bitbucket|dev\.azure\.com|visualstudio\.com/i.test(url) ? "REPO" : "LINK";
function addLink(u, id, url, labelText) {
  const r = loadReq(u, id); const st = proj(r.pid).status;
  const ov = require_(u, st === "Active", `Project is ${st}; changes are blocked.`, r.pid);
  url = cleanUrl(url); labelText = (labelText || "").trim();
  if ((S.links || []).some(l => l.rid === id && l.url === url)) throw new RuleError("That link is already added.");
  (S.links = S.links || []).push({id: nextId("l"), rid: id, url, label: labelText, uid: u.id, at: now()});
  log(r.pid, u, `Added ${linkKind(url) === "REPO" ? "repository" : "reference"} link ${labelText || url}`, {rid: id, override: ov});
}
const linkRow = (l, extra = "") => `<li class="file"><span class="ext" aria-hidden="true">${linkKind(l.url)}</span><span class="file-main">
  <a class="file-name" href="${h(l.url)}" target="_blank" rel="noopener noreferrer">${h(l.label || l.url)}</a>
  <span class="file-meta">${l.label ? h(l.url) + " · " : ""}${l.uid ? `${h(uname(l.uid))} · ${fmt(l.at)}` : "Saved when you press Send or Keep it with me"}</span></span>${extra}</li>`;
const linkInputs = (prefix, act, rid) => `<div class="row" style="margin:0">
  <label for="${prefix}-url">Link<input id="${prefix}-url" type="url" placeholder="https://github.com/team/repo" autocomplete="off"></label>
  <label for="${prefix}-label">Label (optional)<input id="${prefix}-label" placeholder="e.g. Main repository" autocomplete="off"></label>

// ---------- email (recorded, not sent) ----------
function handoff(actor, r, action, to, comment, internal) {
  if (!to) return null;
  const rec = user(to), p = proj(r.pid);
  const hide = internal && has(r.pid, to, SH);
  const lines = [`${actor.name} sent you a requirement (${action}).`, "", `Project: ${p.code} · ${p.name}`,
    `Requirement: #${r.id} ${r.title}`, `Stage: ${STAGES[r.stage]}`,
    `Priority: ${r.priority}` + (r.due ? ` · Due: ${r.due}` : "")];
  if (comment && !hide) lines.push("", "Comment:", comment);
  S.outbox.unshift({at: now(), to: rec.email, subject: `[IDLC Streams ${p.code}] #${r.id} ${r.title}: ${action}`, body: lines.join("\n")});
  S.outbox = S.outbox.slice(0, 30);
  return rec.name;
}

let teamSeq = 0;
function teamRow() {
  const i = ++teamSeq, people = S.users.filter(x => !x.cto);

function teamPicks(f) {
  // Rows for the same person are merged, so one person can get several roles.
  const byUser = new Map();
  [...f.querySelectorAll(".team-row")].forEach(row => {
    const uid = +row.querySelector(".np-user").value; if (!uid) return;
    const list = byUser.get(uid) || []; row.querySelectorAll(".np-role").forEach(x => { if (!list.includes(x.value)) list.push(x.value); }); byUser.set(uid, list);
  });
  return [...byUser].map(([uid, roles]) => ({uid, roles}));
}
function wizGo(step) {
  const f = modal.querySelector("form[data-form=newproject]");
  const name = f.querySelector("#np-name").value.trim();
  if (step > 1 && !name) { const e = modal.querySelector("#modal-error"); e.textContent = "Give the project a name first."; e.hidden = false; f.querySelector("#np-name").focus(); return; }
  if (step === 3) { try { teamPicks(f); } catch (err) { const e = modal.querySelector("#modal-error"); e.textContent = "Cannot do that: " + err.message; e.hidden = false; return; } }
  modal.querySelector("#modal-error").hidden = true;
  f.dataset.step = step;
  f.querySelectorAll("section[data-step]").forEach(sec => { sec.hidden = +sec.dataset.step !== step; });
  modal.querySelector("#wiz-line").innerHTML = wizPhases(step);
  f.querySelector("[data-act=wiz-back]").hidden = step === 1;
  f.querySelector("[data-act=wiz-next]").hidden = step === 3;
  f.querySelector("#np-create").hidden = step !== 3;
  if (step === 3) {
    const team = teamPicks(f).map(t => `${h(uname(t.uid))} (${h(t.roles.join(", "))})`);
    const heads = S.users.filter(x => x.cto).map(x => `${h(x.name)} (Project Head)`);
    modal.querySelector("#np-review").innerHTML = `<dl class="kv"><dt>Name</dt><dd>${h(name)}</dd><dt>Code</dt><dd>${genCode(name)}</dd>
      <dt>Folder</dt><dd><code>${h(FILE_ROOT)}\\${genCode(name)}</code></dd><dt>Status</dt><dd>${label("Active")}</dd>
      <dt>Priority</dt><dd>${priLabel(f.querySelector("#np-pri").value)}</dd><dt>Start from</dt><dd>${h(f.querySelector("#np-start").value) || "None"}</dd><dt>Deadline</dt><dd>${h(f.querySelector("#np-deadline").value) || "None"}</dd>
      <dt>Team</dt><dd>${heads.concat(team).join("<br>")}</dd></dl>`;
    f.querySelector("#np-create").focus();
  } else { const first = f.querySelector(`section[data-step="${step}"] input, section[data-step="${step}"] select`); if (first) first.focus(); }
}

// Sent Requests (everyone): every requirement this person sent, newest first, with Unsend while it has not moved on.

// Notifications: activity from the last 24 hours that this person is allowed to see, excluding their own actions.

const lower = t => t.charAt(0).toLowerCase() + t.slice(1);
function notifText(x, u, p, r, toList) {
  const q = r ? `“${r.title}”` : "", a = x.action.replace(/ \((CTO|Project Lead) override\)$/, "");
  const mine = toList.includes(u.id), others = toList.filter(t => t !== u.id).map(uname);

    : `sent requirement ${q} to ${toList.map(uname).join(", ") || "no one"} · ${STAGES[x.toStage]}`;

  if (a === "Unsent") return (x.fromList || []).includes(u.id) ? `took back requirement ${q}. It was sent to you by mistake; no action is needed.`
    : mine ? `took back requirement ${q}; it is with you again · ${STAGES[x.toStage]}` : `took back requirement ${q} from ${(x.fromList || []).map(uname).join(", ")}`;
  if (a === "Accepted and closed") return `approved and closed requirement ${q}`;

  if (r) return `${lower(a)} on ${q}`;

  if (a.startsWith("Removed")) return `${lower(a)}${x.from ? ` · ${x.from === u.id ? "you" : uname(x.from)}` : ""} in ${p.code}`;
  return `${lower(a)} in ${p.code}`;
}
function notifications(u) {
  const since = now() - DAY, out = [];

    const p = proj(x.pid); if (!p || !canView(u, x.pid)) return;
    const toList = (x.toList || [x.to]).filter(Boolean), aboutMe = toList.includes(u.id) || (x.fromList || [x.from]).includes(u.id);
    const r = x.rid ? req(x.rid) : null, open = r && canSeeReq(u, r);
    // Head, Project Lead and Dev Lead see all activity in their projects; everyone else only what is about them.
    if (!(aboutMe || (seesAll(u, x.pid) && (!r || open)))) return;
    out.push({at: x.at, who: actorLabel(x.pid, x.uid), text: notifText(x, u, p, r, toList), rid: open ? r.id : null, pid: x.pid, mine: toList.includes(u.id)});
  });
  S.comments.forEach(c => {

  });

}

  u.notifSeen = now();
  return `<h1>Notifications</h1><p class="note">Assignments and activity from the last 24 hours that involve you or that you are allowed to see.</p>
  ${list.length ? `<ul class="notifs">${list.map(n => `<li class="notif${n.at > prev ? " is-new" : ""}${n.mine ? " is-mine" : ""}">
    <div class="notif-main"><p class="notif-text"><strong>${h(n.who)}</strong> ${h(n.text)}</p>
      <p class="file-meta"><time>${ago(n.at)}</time> · ${h(proj(n.pid).code)}${n.at > prev ? ` · ${label("New", "tag-sh")}` : ""}</p></div>
    ${n.rid ? `<button class="btn secondary" data-act="open-card" data-id="${n.rid}">Open</button>` : `<button class="btn secondary" data-go="project" data-id="${n.pid}">View project</button>`}</li>`).join("")}</ul>`
    : `<p style="margin-top:1rem">No activity in the last 24 hours.</p>`}`;
}
function viewAdmin(u) {
  if (!u.cto) return "<h1>Not allowed</h1><p>Admin is for the CTO only.</p>";
  return `<h1>Admin</h1>
  <section><h2>Projects</h2><p>Codes are generated from the project name. You join every project as Project Head.</p>
    <button class="btn primary" data-act="open-project">New project</button></section>
  <section><h2>Roles</h2>
    <p class="note">Built-in roles keep their permissions. A new role can be given to project members, who can then hold and send requirements.</p>
    <div class="chips">${[HEAD].concat(S.roles).map(r => label(r, DEFAULT_ROLES.includes(r) || r === HEAD ? "" : "st-new")).join("")}</div>
    <form data-form="newrole" class="row"><label for="new-role">New role name<input id="new-role" name="name" required autocomplete="off" placeholder="e.g. UX Designer"></label>
      <button class="btn primary">Add role</button></form></section>
  <section><h2>Stages</h2>
    <p class="note">The holder picks from these when sending. A new stage is added before Closed and gets its own folder.</p>
    <ol class="stage-list">${stageOrder().map(n => `<li>${stageLabel(n)} <span class="file-meta">${isFeedback(n) ? "Feedback, comment required · " : ""}${stageFolder(n)}</span></li>`).join("")}</ol>
    <form data-form="newstage" class="row"><label for="new-stage">New stage name<input id="new-stage" name="name" required autocomplete="off" placeholder="e.g. UAT"></label>
      <label class="check"><input type="checkbox" id="new-stage-fb" name="feedback" value="yes"> Feedback stage (comment required)</label>
      <button class="btn primary">Add stage</button></form></section>
  <section><h2>Users</h2><form data-form="newuser" class="stack narrow">
    <label for="nu-name">Full name<input id="nu-name" name="name" required></label>
    <label for="nu-username">Username<input id="nu-username" name="username" required></label>
    <label for="nu-email">Email<input id="nu-email" type="email" name="email"></label>
    <button class="btn primary">Add user</button></form>
    ${tbl(`<thead><tr><th>Name</th><th>Username</th><th>Email</th></tr></thead><tbody>${S.users.map(x => `<tr><td>${h(x.name)}${x.cto ? " (CTO)" : ""}</td><td>${h(x.username)}</td><td>${h(x.email)}</td></tr>`).join("")}</tbody>`)}
  </section>
  <section><h2>Email log</h2><p class="note">Demo only: emails the app would send. Newest first.</p>
    ${S.outbox.length ? S.outbox.map(m => `<div class="mail"><strong>${h(m.subject)}</strong><br>To ${h(m.to)} · ${fmt(m.at)}<pre>${h(m.body)}</pre></div>`).join("") : "<p>No emails yet. Act on a requirement to see one.</p>"}
  </section>`;
}

function render() {
  applyPrefs();
  const u = me(), v = S.view;
  const body = v.name === "projects" ? viewProjects(u) : v.name === "project" ? viewProject(u, v.id)
    : v.name === "admin" ? viewAdmin(u) : v.name === "archive" ? viewArchive(u)
    : v.name === "paused" ? viewPaused(u) : v.name === "sent" ? viewSent(u) : v.name === "notifications" ? viewNotifications(u) : viewQueue(u);
  renderTop();
  main.innerHTML = (S.flash ? `<div class="flash ${S.flash.type}" role="${S.flash.type === "error" ? "alert" : "status"}">${h(S.flash.text)}</div>` : "") + body;
  save();
}

// ---------- events ----------
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go, g.dataset.id ? +g.dataset.id : undefined); return; }
  if (e.target === modal) { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "close") { closeModal(); return; }
  if (act === "open-card") { S.flash = null; reqCard(+a.dataset.id); return; }
  if (act === "add-dummy" || act === "add-dummy-new") { addDummy(a); return; }
  if (act === "add-link" || act === "add-link-new") { addLinkUi(a); return; }
  if (act === "drop-dummy") { const list = a.closest("ul"); a.closest("li").remove();
    if (!list.querySelector("li")) list.innerHTML = `<li class="note">${list.id === "nr-link-list" ? "No links yet." : "No files yet."}</li>`; return; }
  if (act === "role-add") {
    const box = a.closest(".role-picks"), first = box.querySelector("select"), id = `rp-${++teamSeq}`;
    const used = [...box.querySelectorAll("select")].map(x => x.value), next = [...first.options].find(o => !used.includes(o.value));
    a.insertAdjacentHTML("beforebegin", `<div class="role-extra"><label for="${id}">${a.dataset.more || "Another role"}${first.outerHTML.replace(/ id="[^"]*"/, ` id="${id}"`).replace(/ name="[^"]*"/, "")}</label>
      <button type="button" class="linkish" data-act="role-drop">${a.dataset.drop || "Remove role"}</button></div>`);
    const sel = document.getElementById(id); sel.value = next ? next.value : first.value; sel.focus(); return;
  }
  if (act === "role-drop") { a.closest(".role-extra").remove(); return; }
  if (act === "team-add") { modal.querySelector("#np-team").insertAdjacentHTML("beforeend", teamRow()); modal.querySelector("#np-team .team-row:last-child select").focus(); return; }
  if (act === "team-remove") { a.closest(".team-row").remove(); return; }
  if (act === "open-req") { reqDialog(+a.dataset.pid); return; }
  if (act === "open-project") { projectDialog(); return; }
  if (act === "wiz-next" || act === "wiz-back") { const f = modal.querySelector("form[data-form=newproject]"); wizGo(+f.dataset.step + (act === "wiz-next" ? 1 : -1)); return; }
  run(() => {
    if (a.dataset.act === "unsend") { const res = unsend(me(), +a.dataset.hid); flash("ok", `Unsent from ${res.names}. “${res.title}” is back in your queue at ${res.stage}.`); }
    if (a.dataset.act === "remove-role") { removeRole(me(), +a.dataset.pid, +a.dataset.uid, a.dataset.role); flash("ok", `Role ${a.dataset.role} removed.`); }
    if (a.dataset.act === "remove") { removeMember(me(), +a.dataset.pid, +a.dataset.uid); flash("ok", "Member removed."); }
    if (a.dataset.act === "download") flash("ok", `${a.dataset.name} is a dummy file with no content. In the real app this downloads it from the network share.`);
  });
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), u = me(), id = +f.dataset.id, pid = +f.dataset.pid;
  if (f.dataset.form === "newproject" && f.dataset.step !== "3") { wizGo(+f.dataset.step + 1); return; }
  run(() => {
    switch (f.dataset.form) {
      case "prefs": Object.assign(u, {theme: d.theme, font: d.font, size: +d.size}); flash("ok", "Settings saved to your account."); break;
      case "card": {
        const doIt = e.submitter && e.submitter.value, internal = d.internal === "yes";
        if (doIt === "comment") { addComment(u, id, d.comment, internal); return {reopen: id}; }
        const st = +d.stage, to = proceed(u, id, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
        flash("ok", st === 8 ? "Approved. The requirement is Closed." : `Sent to ${to} in ${STAGES[st]}. They were emailed.`); break;
      }
      case "newreq": {
        const internal = d.internal === "yes", st = +d.stage, doIt = e.submitter && e.submitter.value;
        if (!d.title.trim()) throw new RuleError("Give the requirement a title.");
        if (doIt === "send" && isFeedback(st) && !d.comment.trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one.");
        const rid = createReq(u, pid, d.title, d.desc, d.due, d.priority, d.start);
        [...f.querySelectorAll("#nr-file-list li[data-name]")].forEach(li => upload(u, rid, li.dataset.name));
        [...f.querySelectorAll("#nr-link-list li[data-url]")].forEach(li => addLink(u, rid, li.dataset.url, li.dataset.label));
        if (doIt === "send") {
          const to = proceed(u, rid, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
          flash("ok", `Requirement #${rid} created and sent to ${to} in ${STAGES[st]}. They were emailed.`);
        } else {
          if (d.comment.trim()) addComment(u, rid, d.comment, internal);
          flash("ok", `Requirement #${rid} created. It is in your queue.`);
        }
        break;
      }
      case "addmember": addMember(u, pid, +d.uid, [...f.querySelectorAll(".np-role")].map(x => x.value)); flash("ok", "Saved. Roles updated."); break;
      case "plan": setPlan(u, pid, d.priority, d.deadline, d.start); flash("ok", "Project priority and dates saved."); break;
      case "status": setStatus(u, pid, d.status, d.confirm === "yes"); flash("ok", d.status === "Closed" ? "Project closed. It is now in the Archive." : `Project status is now ${d.status}.`); break;
      case "newproject": {
        const np = createProject(u, d.name, d.priority, d.deadline, d.start);
        teamPicks(f).forEach(t => addMember(u, np, t.uid, t.roles));
        S.view = {name: "project", id: np}; flash("ok", `Project ${proj(np).code} created. Its folder was made on the share.`); break;
      }
      case "newrole": {
        if (!u.cto) throw new Forbidden("Only the CTO adds roles.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a role name.");
        if ([HEAD].concat(S.roles).some(r => r.toLowerCase() === n.toLowerCase())) throw new RuleError("That role already exists.");
        S.roles.push(n); syncLists(); flash("ok", `Role "${n}" added. It is now in every role dropdown.`); break;
      }
      case "newstage": {
        if (!u.cto) throw new Forbidden("Only the CTO adds stages.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a stage name.");
        if (S.stages.some(x => x.name.toLowerCase() === n.toLowerCase())) throw new RuleError("That stage already exists.");
        const id = Math.max(...S.stages.map(x => x.id)) + 1, folders = new Set(S.stages.map(x => x.folder)).size;
        const folder = `${String(folders + 1).padStart(2, "0")}_${clean(n, 40).replace(/ /g, "_")}`;
        S.stages.splice(S.stages.findIndex(x => x.id === 8), 0, {id, name: n, feedback: d.feedback === "yes", folder, cls: d.feedback === "yes" ? "st-fb" : "st-new"});
        syncLists(); flash("ok", `Stage "${n}" added. It is now in the Stage dropdown when sending.`); break;
      }
      case "newuser": {
        const un = d.username.trim(); if (!un || !d.name.trim()) throw new RuleError("Name and username are required.");
        if (S.users.some(x => x.username === un)) throw new RuleError("That username already exists.");
        S.users.push({id: nextId("u"), username: un, name: d.name.trim(), email: d.email.trim(), cto: false, theme: "dark", font: "system", size: 2});
        flash("ok", "User added."); break;
      }
    }
  }, f);
});
document.addEventListener("input", e => {
  if (e.target.id === "arc-q") {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll("details.arc").forEach(d => { const on = !q || d.dataset.q.includes(q); d.hidden = !on; if (on) shown++; if (q && on) d.open = true; });
    document.querySelectorAll("tr.arc-row").forEach(tr => { if (tr.closest("details.arc")) return; const on = !q || tr.dataset.q.includes(q); tr.hidden = !on; if (on) shown++; });
    document.getElementById("arc-none").hidden = shown > 0;
  }
  if (e.target.id === "np-name") {
    const c = genCode(e.target.value); document.getElementById("np-code").textContent = c;
    document.getElementById("np-folder").textContent = `${FILE_ROOT}\\${c}`;
  }
});
// Dummy files: a name only, for trying the flow without real files.
function addLinkUi(btn) {
  const isNew = btn.dataset.act === "add-link-new", pre = isNew ? "nr-link" : "cd-link", err = modal.querySelector("#modal-error");
  const urlIn = document.getElementById(pre + "-url"), labelIn = document.getElementById(pre + "-label");
  if (isNew) {
    let url; try { url = cleanUrl(urlIn.value); } catch (e) { err.textContent = "Cannot do that: " + e.message; err.hidden = false; urlIn.focus(); return; }
    err.hidden = true;
    const list = document.getElementById("nr-link-list"), note = list.querySelector("li.note"); if (note) note.remove();
    if (list.querySelector(`li[data-url="${CSS.escape(url)}"]`)) { err.textContent = "Cannot do that: That link is already added."; err.hidden = false; return; }
    list.insertAdjacentHTML("beforeend", linkRow({url, label: labelIn.value.trim()}, `<button type="button" class="linkish" data-act="drop-dummy">Remove</button>`)
      .replace('<li class="file">', `<li class="file" data-url="${h(url)}" data-label="${h(labelIn.value.trim())}">`));
    urlIn.value = ""; labelIn.value = ""; urlIn.focus(); return;
  }
  const rid = +btn.dataset.rid, keep = (document.getElementById("cd-comment") || {}).value;
  run(() => { addLink(me(), rid, urlIn.value, labelIn.value); flash("ok", "Link added."); return {reopen: rid, comment: keep}; }, btn.closest("form"));
}
function addDummy(btn) {
  const isNew = btn.dataset.act === "add-dummy-new", input = document.getElementById(isNew ? "nr-dummy" : "cd-dummy");
  const name = input.value.trim(), err = modal.querySelector("#modal-error");
  if (!name) { err.textContent = "Cannot do that: type a file name first, for example test_plan.xlsx."; err.hidden = false; input.focus(); return; }
  err.hidden = true;
  if (isNew) {
    const list = document.getElementById("nr-file-list"), note = list.querySelector("li.note"); if (note) note.remove();
    list.insertAdjacentHTML("beforeend", `<li class="file" data-name="${h(name)}"><span class="ext" aria-hidden="true">${extOf(name)}</span><span class="file-main"><span class="file-name">${h(name)}</span><span class="file-meta">Dummy file · added when you press Send or Keep it with me</span></span><button type="button" class="linkish" data-act="drop-dummy">Remove</button></li>`);
    input.value = ""; input.focus(); return;
  }
  const rid = +btn.dataset.rid, keep = (document.getElementById("cd-comment") || {}).value;
  run(() => { const saved = upload(me(), rid, name); flash("ok", `Dummy file ${saved} added.`); return {reopen: rid, comment: keep}; }, btn.closest("form"));
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && ["cd-dummy", "nr-dummy", "cd-link-url", "cd-link-label", "nr-link-url", "nr-link-label"].includes(e.target.id)) {
    e.preventDefault(); e.target.closest(".row").querySelector("button").click();
  }
});
function run(fn, form) {
  const inModal = !!(form && modal.contains(form));
  let res;
  try { res = fn(); } catch (err) {
    if (!(err instanceof Forbidden || err instanceof RuleError)) throw err;
    const msg = (err instanceof Forbidden ? "Not allowed: " : "Cannot do that: ") + err.message;
    if (inModal) { const el = modal.querySelector("#modal-error"); el.textContent = msg; el.hidden = false; return; }
    flash("error", msg);
  }
  if (res && res.reopen) { render(); reqCard(res.reopen, res.comment); return; }
  if (inModal) closeModal();
  render();
  if (S.flash && S.flash.type === "error") window.scrollTo(0, 0);
}
document.getElementById("as-user").addEventListener("change", e => {
  S.me = +e.target.value; const u = me();
  if (((S.view.name === "admin" || S.view.name === "paused") && !u.cto) || S.view.name === "notifications") S.view = {name: "queue"};
  flash("ok", `Now viewing as ${u.name}${u.cto ? " (CTO)" : ""}. Roles: ${S.projects.filter(p => role(p.id, u.id)).map(p => `${p.code} ${role(p.id, u.id)}`).join(", ") || (u.cto ? "CTO on all projects" : "none")}.`);
  render();
});
const rc = document.getElementById("reset-confirm"), rb = document.getElementById("reset-demo");
rb.addEventListener("click", () => { rc.hidden = false; rb.hidden = true; });
document.getElementById("reset-no").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; });
document.getElementById("reset-yes").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; const keep = {roles: S.roles, stages: S.stages}; seed(); Object.assign(S, keep); syncLists();
  flash("ok", "All projects and requirements were deleted. Roles and stages were kept."); render(); });

if (!load()) seed();
syncLists();
S.reqs.forEach(r => { if (!r.holders) r.holders = r.holder ? [r.holder] : []; delete r.holder; });
S.projects.forEach(p => p.members.forEach(m => { if (!m.roles) { m.roles = [m.role]; delete m.role; } }));
if (!S.iosDefault) { S.users.forEach(x => { if (x.font === "poppins") x.font = "system"; }); S.iosDefault = true; }
if (!S.darkDefault) { S.users.forEach(x => { x.theme = "dark"; }); S.darkDefault = true; }
S.flash = S.flash || {type: "ok", text: S.projects.length ? `You are viewing as ${me().name}. Use "Viewing as" above to switch person.`
  : `No projects yet. You are viewing as ${me().name} (CTO): press New project to start. Use "Viewing as" above to switch person.`};
render();
</script>
