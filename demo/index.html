<style>
/* Layout: the real PMT screens (top bar, single content column) under a thin demo strip for switching users.
   Tokens match the app's style.css; one accent colour, AA contrast in both themes. */
:root {
  --bg: #ffffff; --surface: #f1f4f8; --surface-2: #e6ebf2; --text: #0b1220; --muted: #3b4656; --border: #5f6b7a; --accent: #0a51a1; --on-accent: #ffffff; --error: #a3141d; --ok: #12662f; --demo: #fff6d6; --an-bg: #dbeeff; --an-fg: #0b4a85; --dev-bg: #ece5ff; --dev-fg: #4b2a9b; --qa-bg: #fff0c7; --qa-fg: #6b4a00; --ap-bg: #daf5e4; --ap-fg: #11632f; --fb-bg: #ffe0e0; --fb-fg: #9b1c1c; --cl-bg: #e6e9ee; --cl-fg: #2f3a48; --int: #8a5a00;
  --font: "Poppins", system-ui, sans-serif; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --size: 16px; --space: 1rem; --radius: .375rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1117; --surface: #161b22; --surface-2: #1f2630; --text: #f3f6fa; --muted: #c3cbd6; --border: #7d8896; --accent: #6cb6ff; --on-accent: #071526; --error: #ff8f8f; --ok: #6fe39b; --demo: #2b2410; --an-bg: #0f2e4d; --an-fg: #a8d8ff; --dev-bg: #2a1f52; --dev-fg: #d0bcff; --qa-bg: #3d2c06; --qa-fg: #ffd47a; --ap-bg: #0f3a20; --ap-fg: #8ef0b0; --fb-bg: #4a1515; --fb-fg: #ffb3b3; --cl-bg: #2a3038; --cl-fg: #dbe1e8; --int: #ffc65c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0d1117; --surface: #161b22; --surface-2: #1f2630; --text: #f3f6fa; --muted: #c3cbd6; --border: #7d8896; --accent: #6cb6ff; --on-accent: #071526; --error: #ff8f8f; --ok: #6fe39b; --demo: #2b2410; --an-bg: #0f2e4d; --an-fg: #a8d8ff; --dev-bg: #2a1f52; --dev-fg: #d0bcff; --qa-bg: #3d2c06; --qa-fg: #ffd47a; --ap-bg: #0f3a20; --ap-fg: #8ef0b0; --fb-bg: #4a1515; --fb-fg: #ffb3b3; --cl-bg: #2a3038; --cl-fg: #dbe1e8; --int: #ffc65c; color-scheme: dark; }
/* The app's own per-user Appearance setting (default Dark) wins over the viewer theme. */
:root[data-appearance="light"] { --bg: #ffffff; --surface: #f1f4f8; --surface-2: #e6ebf2; --text: #0b1220; --muted: #3b4656; --border: #5f6b7a; --accent: #0a51a1; --on-accent: #ffffff; --error: #a3141d; --ok: #12662f; --demo: #fff6d6; --an-bg: #dbeeff; --an-fg: #0b4a85; --dev-bg: #ece5ff; --dev-fg: #4b2a9b; --qa-bg: #fff0c7; --qa-fg: #6b4a00; --ap-bg: #daf5e4; --ap-fg: #11632f; --fb-bg: #ffe0e0; --fb-fg: #9b1c1c; --cl-bg: #e6e9ee; --cl-fg: #2f3a48; --int: #8a5a00; color-scheme: light; }
:root[data-appearance="dark"] { --bg: #0d1117; --surface: #161b22; --surface-2: #1f2630; --text: #f3f6fa; --muted: #c3cbd6; --border: #7d8896; --accent: #6cb6ff; --on-accent: #071526; --error: #ff8f8f; --ok: #6fe39b; --demo: #2b2410; --an-bg: #0f2e4d; --an-fg: #a8d8ff; --dev-bg: #2a1f52; --dev-fg: #d0bcff; --qa-bg: #3d2c06; --qa-fg: #ffd47a; --ap-bg: #0f3a20; --ap-fg: #8ef0b0; --fb-bg: #4a1515; --fb-fg: #ffb3b3; --cl-bg: #2a3038; --cl-fg: #dbe1e8; --int: #ffc65c; color-scheme: dark; }
:root[data-font="atkinson"] { --font: "Atkinson Hyperlegible", system-ui, sans-serif; }
:root[data-font="merriweather"] { --font: "Merriweather", Georgia, serif; }
:root[data-size="1"] { --size: 14px; }
:root[data-size="2"] { --size: 16px; }
:root[data-size="3"] { --size: 19px; }

html { font-size: var(--size); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.5; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 70rem; margin: 0 auto; padding-block: var(--space) 3rem; }
h1 { font-size: 1.6rem; margin: .5rem 0 1rem; text-wrap: balance; }
h2 { font-size: 1.25rem; margin: 1.5rem 0 .5rem; text-wrap: balance; }
a, .linkish { color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; text-align: left; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.demo { background: var(--demo); border-bottom: 1px dashed var(--border); font-size: .9rem; }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-block: .4rem; }
.demo-in strong { letter-spacing: .04em; text-transform: uppercase; font-size: .8rem; }
.demo select { min-height: 2rem; padding: .15em .4em; }
.demo .btn { min-height: 2rem; padding: .2em .7em; font-size: .9rem; }

.topbar { background: var(--surface); border-bottom: 2px solid var(--border); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem var(--space); padding-block: .5rem; }
.topbar nav { display: flex; flex-wrap: wrap; gap: var(--space); flex: 1; }
.topbar nav button { font-weight: 600; text-decoration: none; padding: .25rem 0; }
.topbar nav button[aria-current="page"] { text-decoration: underline; text-underline-offset: .3em; text-decoration-thickness: 2px; }
.menu { position: relative; }
.menu summary { cursor: pointer; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: var(--radius); list-style-position: inside; }
.menu-body { position: absolute; right: 0; z-index: 5; width: min(18rem, calc(100vw - 32px)); margin-top: .25rem; padding: var(--space);
  background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); display: grid; gap: .75rem; }

.btn { font: inherit; font-size: 1rem; padding: .5em 1em; border-radius: var(--radius); cursor: pointer;
  border: 2px solid var(--accent); min-height: 2.5rem; }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.secondary { background: transparent; color: var(--accent); }
.btn:hover { text-decoration: underline; }
input, select, textarea { font: inherit; font-size: 1rem; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius); padding: .4em .5em; min-height: 2.5rem; max-width: 100%; }
textarea { width: 100%; }
label { display: grid; gap: .25rem; font-weight: 600; }
label.check { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
label.check input { min-height: auto; width: 1.1rem; height: 1.1rem; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .75rem; display: grid; gap: .25rem; }
.stack { display: grid; gap: .75rem; }
.stack > .btn { justify-self: start; }
.narrow { max-width: 24rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: .75rem 0; }
.row > label { min-width: 0; }

.tbl { overflow-x: auto; margin: .5rem 0 1rem; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface); white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.label { display: inline-block; padding: 0 .4em; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: .9rem; font-weight: 600; white-space: nowrap; }
.label.warn { border-color: var(--error); color: var(--error); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space); margin: var(--space) 0; }
.panel > h2:first-child { margin-top: 0; }
summary { cursor: pointer; font-weight: 600; }
.details { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem var(--space); }
.details dt { font-weight: 600; color: var(--muted); }
.details dd { margin: 0; min-width: 0; }
.pre { white-space: pre-wrap; }
.note { color: var(--muted); font-style: italic; margin: 0; }
.flash { border: 2px solid currentColor; border-radius: var(--radius); padding: .5rem .75rem; margin-bottom: 1rem; font-weight: 600; }
.flash.error { color: var(--error); }
.flash.ok { color: var(--ok); }
.history { padding-left: 1.5rem; margin: 0; }
.history li { margin-bottom: .5rem; }
blockquote { margin: .25rem 0 0; padding-left: .75rem; border-left: 3px solid var(--border); }
.comment { border-bottom: 1px solid var(--border); padding: .25rem 0; }
.comment p { margin: .25rem 0; }
code { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }
.mail { border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .75rem; margin-bottom: .5rem; }
.mail pre { white-space: pre-wrap; font-family: var(--mono); font-size: .85rem; margin: .25rem 0 0; }
.crumb { margin: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
.head-row h1, .head-row h2 { margin-block: .5rem; }

/* Popup cards */
dialog.card { border: 2px solid var(--border); border-radius: .75rem; padding: 0; width: min(46rem, calc(100vw - 32px));
  max-height: calc(100dvh - 32px); background: var(--bg); color: var(--text); box-shadow: 0 1rem 3rem rgba(0, 0, 0, .35); }
dialog.card[open] { display: flex; flex-direction: column; }
dialog.card > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.card-phases { padding: .75rem 1rem 0; flex: none; }
dialog.card::backdrop { background: rgba(8, 12, 20, .6); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .75rem 1rem;
  border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
.card-head h2 { margin: 0; font-size: 1.2rem; }
.card-body { padding: 1rem; display: grid; gap: .9rem; overflow-y: auto; min-height: 0; }
.card-body > * { min-width: 0; }
.card-foot { flex: none; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: flex-end; padding: .75rem 1rem; border-top: 1px solid var(--border); }
.card-foot .spacer { flex: 1; }
.x { font: inherit; font-size: 1.5rem; line-height: 1; background: none; border: 0; color: var(--text); cursor: pointer; padding: .25rem .5rem; border-radius: var(--radius); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem 1rem; margin: 0; }
.kv dt { font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; }

/* Data chips: stage family and priority, each a high-contrast pair */
.label.st-an, .label.pr-normal { background: var(--an-bg); color: var(--an-fg); border-color: currentColor; }
.label.st-dev { background: var(--dev-bg); color: var(--dev-fg); border-color: currentColor; }
.label.st-qa { background: var(--qa-bg); color: var(--qa-fg); border-color: currentColor; }
.label.st-ap { background: var(--ap-bg); color: var(--ap-fg); border-color: currentColor; }
.label.st-fb, .label.pr-high { background: var(--fb-bg); color: var(--fb-fg); border-color: currentColor; }
.label.st-cl, .label.pr-low { background: var(--cl-bg); color: var(--cl-fg); border-color: currentColor; }
.label.tag-int { background: var(--int); color: var(--bg); border-color: var(--int); }
.label.tag-sh { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
tbody tr:nth-child(even) td { background: var(--surface); }
tbody tr:hover td { background: var(--surface-2); }
td .linkish, .history strong, .who { font-weight: 600; }

/* Comments */
.cmt-list { display: grid; gap: .6rem; }
.cmt { background: var(--surface-2); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: var(--radius); padding: .6rem .8rem; }
.cmt.is-internal { border-left-color: var(--int); }
.cmt-head { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; }
.cmt-head time { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.cmt-text { margin: .35rem 0 0; color: var(--text); }

/* File rows */
.files li.file { display: flex; flex-wrap: nowrap; align-items: center; gap: .75rem; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .7rem; }
.ext { flex: none; min-width: 3.2rem; text-align: center; font: 700 .72rem/1 var(--mono); letter-spacing: .04em;
  padding: .45rem .3rem; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); }
.file-main { display: grid; min-width: 0; }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.mail { background: var(--surface-2); }

/* Requirement card */
.fl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .25rem; }
.title-view { font-size: 1.35rem; font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
.meta { margin: .35rem 0 0; display: flex; flex-wrap: wrap; gap: .35rem .75rem; align-items: center; }
.files { list-style: none; margin: 0 0 .5rem; padding: 0; display: grid; gap: .35rem; }
.filebtn { display: inline-flex; align-items: center; font-weight: 600; color: var(--accent); }
.filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.card-section { border-top: 1px solid var(--border); padding-top: .75rem; }
.card-section:first-child { border-top: 0; padding-top: 0; }

/* Phase line */
.phases-wrap { overflow-x: auto; padding: .25rem 0 .5rem; border-bottom: 1px solid var(--border); }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(5rem, 1fr); isolation: isolate; }
.phases li { position: relative; text-align: center; font-size: .8rem; }
.phases li::before { content: ""; position: absolute; top: calc(1rem - 1.5px); right: 50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
.phases li:first-child::before { display: none; }
.phases li.done::before, .phases li.current::before { background: var(--accent); }
.phase { position: relative; z-index: 1; display: grid; justify-items: center; gap: .25rem; padding: 0 .1rem; }
label.phase { font-weight: 400; cursor: pointer; }
label.phase.off { cursor: not-allowed; }
.dot { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 2px solid var(--border); background: var(--bg); color: var(--text); }
.done .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.current .dot { border: 3px solid var(--accent); color: var(--accent); }
.target .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
label.phase:hover .dot { border-color: var(--accent); }
label.phase:focus-within .dot { outline: 3px solid var(--accent); outline-offset: 4px; }
.phase-name { line-height: 1.2; font-size: .72rem; overflow-wrap: anywhere; }
.target .phase-name, .current .phase-name { font-weight: 700; }
.phase-tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); min-height: 1.1em; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

  <span>Nothing is sent or saved to a server. Data stays in this browser.</span>

<script>
"use strict";
const STAGES = {1: "Analysis", 2: "Analysis Feedback", 3: "Development", 4: "Development Feedback", 5: "QA", 6: "QA Feedback", 7: "Approval", 8: "Closed"};
const isFeedback = n => n === 2 || n === 4 || n === 6;
const ROLES = ["Project Lead", "Dev Lead", "Project Analyst", "Business Stakeholder", "Developer", "QA"];
const STATUSES = ["Active", "On Hold", "Cancelled", "Closed"];
const PAUSED = ["On Hold", "Cancelled"];
const PRIORITIES = ["Low", "Normal", "High"];
const CREATORS = ["Business Stakeholder", "Project Analyst", "Project Lead"];
const LEADS = ["Project Lead", "Dev Lead"];
const SH = "Business Stakeholder", AN = "Project Analyst";
const FOLDERS = ["01_Analysis", "02_Development", "03_QA", "04_Approval"];
const STAGE_TO_FOLDER = {1: 0, 2: 0, 3: 1, 4: 1, 5: 2, 6: 2, 7: 3, 8: 3};
const FILE_ROOT = "\\\\fs01\\PMT";
const DAY = 864e5;
const KEY = "pmt-demo-v5";
const HEAD = "Project Head";

let S, CLOCK = null;
const now = () => CLOCK ?? Date.now();

// ---------- helpers ----------
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = t => { const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const isoDay = t => fmt(t).slice(0, 10);
const label = (t, cls = "") => `<span class="label ${cls}">${h(t)}</span>`;
const STAGE_CLS = {1: "st-an", 2: "st-fb", 3: "st-dev", 4: "st-fb", 5: "st-qa", 6: "st-fb", 7: "st-ap", 8: "st-cl"};
const stageLabel = n => label(STAGES[n], STAGE_CLS[n]);
const priLabel = p => label(p, "pr-" + p.split(" ")[0].toLowerCase());
const extOf = n => { const i = n.lastIndexOf("."); return (i > 0 ? n.slice(i + 1, i + 5) : "file").toUpperCase(); };
const user = id => S.users.find(u => u.id === id);
const uname = id => (user(id) || {}).name || "None";
const me = () => user(S.me);
const proj = id => S.projects.find(p => p.id === id);
const req = id => S.reqs.find(r => r.id === id);
const role = (pid, uid) => ((proj(pid)?.members || []).find(m => m.uid === uid) || {}).role || null;
const canView = (u, pid) => u.cto || !!role(pid, u.id);
const nextId = k => (S.seq[k] = (S.seq[k] || 0) + 1);
const clean = (t, n) => (t.replace(/[^A-Za-z0-9._ -]+/g, "_").replace(/^[ ._]+|[ ._]+$/g, "").slice(0, n) || "file");
const tbl = inner => `<div class="tbl"><table>${inner}</table></div>`;

class Forbidden extends Error {}
class RuleError extends Error {}
function require_(u, ok, msg) { if (ok) return false; if (u.cto) return true; throw new Forbidden(msg); }
function log(pid, u, action, o = {}) {
  S.history.push({id: nextId("h"), pid, rid: o.rid ?? null, uid: u.id, at: now(), action: action + (o.override ? " (CTO override)" : ""),
    from: o.from ?? null, to: o.to ?? null, fromStage: o.fromStage ?? null, toStage: o.toStage ?? null,
    comment: (o.comment || "").trim(), internal: !!o.internal, override: !!o.override});
}
const stakeholderView = (u, pid) => !u.cto && role(pid, u.id) === SH;

// ---------- projects & members ----------
// Code = initials of the name (up to 4) + running number, e.g. "Customer Portal Revamp" -> CPR-001.
function genCode(name) {
  const ini = (name || "").split(/[^A-Za-z0-9]+/).filter(Boolean).map(w => w[0].toUpperCase()).join("").slice(0, 4) || "PRJ";
  return `${ini}-${String((S.seq.p || 0) + 1).padStart(3, "0")}`;
}
function createProject(u, name) {
  if (!u.cto) throw new Forbidden("Only the CTO creates projects.");
  name = name.trim(); if (!name) throw new RuleError("Give the project a name.");
  const code = genCode(name);
  const p = {id: nextId("p"), name, code, status: "Active", pausedAt: null, folder: `${FILE_ROOT}\\${code}`,
    members: S.users.filter(x => x.cto).map(x => ({uid: x.id, role: HEAD}))};
  S.projects.push(p); log(p.id, u, `Project created with code ${code}`); return p.id;
}
function memberRule(u, pid, r) {
  if (r === SH) { if (!u.cto) throw new Forbidden("Only the CTO manages Business Stakeholders."); }
  else if (!(u.cto || LEADS.includes(role(pid, u.id)))) throw new Forbidden("Only the CTO, Project Lead or Dev Lead manage members.");
}
function addMember(u, pid, uid, r) {
  if (!ROLES.includes(r)) throw new RuleError("Unknown role.");
  memberRule(u, pid, r);
  if (role(pid, uid)) throw new RuleError("That person is already a member.");
  proj(pid).members.push({uid, role: r}); log(pid, u, `Added member as ${r}`, {to: uid});
}
function removeMember(u, pid, uid) {
  const r = role(pid, uid); if (!r) throw new RuleError("That person is not a member.");
  if (r === HEAD) throw new RuleError("The Project Head is in every project and cannot be removed.");
  memberRule(u, pid, r);
  if (S.reqs.some(x => x.pid === pid && x.holder === uid && x.stage < 8)) throw new RuleError(`${uname(uid)} holds open requirements. Reassign them first.`);
  const p = proj(pid); p.members = p.members.filter(m => m.uid !== uid); log(pid, u, `Removed member (${r})`, {from: uid});
}
function setStatus(u, pid, status, confirm) {
  if (!u.cto) throw new Forbidden("Only the CTO changes project status.");
  const p = proj(pid); if (status === p.status) return;
  if (status === "Closed") {
    if (S.reqs.some(r => r.pid === pid && r.stage < 8)) throw new RuleError("All requirements must be Closed before the project can close.");
    if (!confirm) throw new RuleError("Tick the confirmation box to close the project.");
  }
  const t = now();
  if (PAUSED.includes(status) && !PAUSED.includes(p.status)) p.pausedAt = t;
  else if (!PAUSED.includes(status) && PAUSED.includes(p.status)) {
    const delta = p.pausedAt ? t - p.pausedAt : 0;
    S.reqs.filter(r => r.pid === pid && r.stage < 8).forEach(r => { r.entered += delta; });
    p.pausedAt = null;
  }
  log(pid, u, `Status changed: ${p.status} to ${status}`); p.status = status;
}

// ---------- requirements & actions ----------
function createReq(u, pid, title, desc, due, priority) {
  const p = proj(pid); if (!canView(u, pid)) throw new Forbidden("You are not a member of this project.");
  title = title.trim(); if (!title) throw new RuleError("Title is required.");
  let ov = require_(u, u.cto || CREATORS.includes(role(pid, u.id)), "Only Stakeholders, Analysts, Project Leads or the CTO create requirements.");
  ov = require_(u, p.status === "Active", `Project is ${p.status}; no new requirements.`) || ov;
  const id = nextId("r"), t = now();
  S.reqs.push({id, pid, title, desc: desc.trim(), stage: 1, holder: u.id, prev: null, prevStage: null, due: due || null,
    priority, feedback: false, createdBy: u.id, entered: t, created: t, folder: `${p.folder}\\${id}_${clean(title, 50).replace(/ /g, "_")}`});
  log(pid, u, "Created requirement", {rid: id, to: u.id, toStage: 1, override: ov});
  return id;
}
function guard(u, r) {
  if (r.stage === 8) throw new RuleError("This requirement is Closed.");
  const st = proj(r.pid).status;
  let ov = require_(u, st === "Active", `Project is ${st}; actions are blocked.`);
  return require_(u, r.holder === u.id, "Only the current holder can act on this requirement.") || ov;
}
function memberRole(pid, uid) { const r = role(pid, uid); if (!r) throw new RuleError("Choose a project member to send to."); return r; }
function needComment(c) { if (!(c || "").trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one."); }
function move(u, r, action, to, toStage, comment, internal, ov, setPrev = true) {
  if (stakeholderView(u, r.pid)) internal = false;
  const from = r.holder, fromStage = r.stage;
  if (toStage !== r.stage) r.entered = now();
  if (setPrev) { r.prev = u.id; r.prevStage = fromStage; }
  r.stage = toStage; r.holder = to;
  log(r.pid, u, action, {rid: r.id, from, to, fromStage, toStage, comment, internal, override: ov});
  return handoff(u, r, action, to, (comment || "").trim(), internal);
}
const canSeeReq = (u, r) => u.cto || r.holder === u.id;
function loadReq(u, id) { const r = req(id); if (!canSeeReq(u, r)) throw new Forbidden("Only the current holder and the CTO can open this requirement."); return r; }
function proceed(u, id, to, comment, internal, stage) {
  const r = loadReq(u, id); const ov = guard(u, r);
  if (!STAGES[stage]) throw new RuleError("Choose a stage.");
  if (stage === 8) return accept(u, id, comment);
  if (isFeedback(stage)) needComment(comment);
  memberRole(r.pid, to);
  return move(u, r, "Send", to, stage, comment, internal, ov);
}
function accept(u, id, comment) {
  const r = loadReq(u, id); let ov = guard(u, r);
  ov = require_(u, r.stage === 7 && role(r.pid, u.id) === SH, "Only the Business Stakeholder can close it, from Approval.") || ov;
  return move(u, r, "Accepted and closed", null, 8, comment, false, ov);
}
function reassign(u, id, to, comment) {
  const r = loadReq(u, id); if (r.stage === 8) throw new RuleError("This requirement is Closed.");
  const st = proj(r.pid).status;
  let ov = require_(u, st === "Active", `Project is ${st}; actions are blocked.`);
  ov = require_(u, LEADS.includes(role(r.pid, u.id)), "Only the Project Lead or Dev Lead can reassign.") || ov;
  memberRole(r.pid, to);
  return move(u, r, "Reassign", to, r.stage, comment, false, ov, false);
}
function addComment(u, id, text, internal) {
  const r = loadReq(u, id); text = (text || "").trim(); if (!text) throw new RuleError("Write a comment first.");
  if (stakeholderView(u, r.pid)) internal = false;
  S.comments.push({id: nextId("c"), rid: id, uid: u.id, at: now(), text, internal: !!internal});
}
function upload(u, id, filename) {
  const r = loadReq(u, id); const st = proj(r.pid).status;
  const ov = require_(u, st === "Active", `Project is ${st}; uploads are blocked.`);
  const folder = FOLDERS[STAGE_TO_FOLDER[r.stage]];
  const base0 = clean(filename.split(/[\\/]/).pop(), 80), dot = base0.lastIndexOf(".");
  const base = dot > 0 ? base0.slice(0, dot) : base0, ext = dot > 0 ? base0.slice(dot) : "";
  const taken = new Set(S.files.filter(f => f.rid === id && f.folder === folder).map(f => f.name));
  let name = base0, n = 1; while (taken.has(name)) name = `${base}_v${++n}${ext}`;
  S.files.push({id: nextId("f"), rid: id, stage: r.stage, folder, name, uid: u.id, at: now()});
  log(r.pid, u, `Uploaded ${name}`, {rid: id, override: ov});
  return name;
}

// ---------- email (recorded, not sent) ----------
function handoff(actor, r, action, to, comment, internal) {
  if (!to) return null;
  const rec = user(to), p = proj(r.pid);
  const hide = internal && role(r.pid, to) === SH;
  const lines = [`${actor.name} sent you a requirement (${action}).`, "", `Project: ${p.code} · ${p.name}`,
    `Requirement: #${r.id} ${r.title}`, `Stage: ${STAGES[r.stage]}`,
    `Priority: ${r.priority}` + (r.due ? ` · Due: ${r.due}` : "")];
  if (comment && !hide) lines.push("", "Comment:", comment);
  S.outbox.unshift({at: now(), to: rec.email, subject: `[PMT ${p.code}] #${r.id} ${r.title}: ${action}`, body: lines.join("\n")});
  S.outbox = S.outbox.slice(0, 30);
  return rec.name;
}

function seed() {

  S = {seq: {}, users: [], projects: [], reqs: [], history: [], comments: [], files: [], outbox: [], stallDays: 5,
       me: 1, view: {name: "projects"}, flash: null};

  const hide = stakeholderView(u, pid);
  return `<ol class="history" reversed>${rows.slice().reverse().map(x => {
    const c = x.comment && !(hide && x.internal) ? `<blockquote>${x.internal ? label("Internal", "tag-int") + " " : ""}${h(x.comment)}</blockquote>` : "";
    return `<li><time>${fmt(x.at)}</time> · <strong>${h(uname(x.uid))}</strong>: ${h(x.action)}${x.from ? ` · from ${h(uname(x.from))}` : ""}${x.to ? ` · to ${h(uname(x.to))}` : ""}${x.fromStage && x.toStage && x.fromStage !== x.toStage ? ` · ${STAGES[x.fromStage]} → ${STAGES[x.toStage]}` : ""}${c}</li>`;
  }).join("")}</ol>`;
}

function viewQueue(u) {
  const order = {High: 0, Normal: 1, Low: 2};
  const items = S.reqs.filter(r => r.holder === u.id && r.stage < 8 && proj(r.pid).status === "Active")
    .sort((a, b) => order[a.priority] - order[b.priority] || (a.due || "9") .localeCompare(b.due || "9") || a.id - b.id);
  return `<h1>My Queue</h1>${items.length ? tbl(`<thead><tr><th>Requirement</th><th>Project</th><th>Stage</th><th>Priority</th><th>Due</th><th>Days in stage</th></tr></thead><tbody>${items.map(r => `
    <tr><td><button class="linkish" data-act="open-card" data-id="${r.id}">#${r.id} ${h(r.title)}</button></td><td>${h(proj(r.pid).code)}</td>
    <td>${stageLabel(r.stage)}</td><td>${priLabel(r.priority)}</td><td class="num">${r.due || ""}</td>
    <td class="num">${Math.floor((now() - r.entered) / DAY)}</td></tr>`).join("")}</tbody>`)
    : "<p>Nothing waiting for you.</p>"}
    <p class="note">Requirements in On Hold or Cancelled projects are hidden here.</p>`;
}

function viewProjects(u) {
  const list = S.projects.filter(p => canView(u, p.id));
  return `<div class="head-row"><h1>Projects</h1>${u.cto ? `<button class="btn primary" data-act="open-project">New project</button>` : ""}</div>${list.length ? tbl(`<thead><tr><th>Code</th><th>Name</th><th>Status</th><th>My role</th><th>${u.cto ? "Open" : "With me"}</th></tr></thead><tbody>${list.map(p => `
    <tr><td>${h(p.code)}</td><td><button class="linkish" data-go="project" data-id="${p.id}">${h(p.name)}</button></td><td>${label(p.status)}</td>
    <td>${h(role(p.id, u.id) || (u.cto ? "CTO" : ""))}</td><td class="num">${S.reqs.filter(r => r.pid === p.id && r.stage < 8 && (u.cto || r.holder === u.id)).length}</td></tr>`).join("")}</tbody>`)
    : "<p>You are not a member of any project.</p>"}`;
}

function viewProject(u, pid) {
  const p = proj(pid); if (!p) return "<h1>Not found</h1>";
  if (!canView(u, pid)) return `<h1>Not allowed</h1><p>${h(u.name)} is not a member of this project, so it is hidden.</p>`;
  const myRole = role(pid, u.id), manage = u.cto || LEADS.includes(myRole);
  const canCreate = (u.cto || CREATORS.includes(myRole)) && (p.status === "Active" || u.cto);
  const order = {High: 0, Normal: 1, Low: 2};
  const reqs = S.reqs.filter(r => r.pid === pid && (u.cto || r.holder === u.id)).sort((a, b) => (a.stage === 8) - (b.stage === 8) || order[a.priority] - order[b.priority] || a.id - b.id);
  const members = memberSort(p);
  const others = S.users.filter(x => !role(pid, x.id));
  return `<h1>${h(p.code)} · ${h(p.name)}</h1>
  <p>Status: ${label(p.status)}${myRole ? ` · My role: ${h(myRole)}` : ""} · Folder: <code>${h(p.folder)}</code></p>
  <section><div class="head-row"><h2>${u.cto ? "All requirements" : "Requirements you hold"}</h2>${canCreate ? `<button class="btn primary" data-act="open-req" data-pid="${pid}">New requirement</button>` : ""}</div>
  ${u.cto ? "" : `<p class="note">You see a requirement only while you hold it. The CTO sees all requirements and who holds them.</p>`}
  ${reqs.length ? tbl(`<thead><tr><th>Requirement</th><th>Stage</th>${u.cto ? "<th>Holder</th>" : ""}<th>Priority</th><th>Due</th></tr></thead><tbody>${reqs.map(r => `
    <tr><td><button class="linkish" data-act="open-card" data-id="${r.id}">#${r.id} ${h(r.title)}</button></td><td>${stageLabel(r.stage)}</td>
    ${u.cto ? `<td>${r.holder ? h(uname(r.holder)) : ""}</td>` : ""}<td>${priLabel(r.priority)}</td><td class="num">${r.due || ""}</td></tr>`).join("")}</tbody>`) : `<p>${u.cto ? "No requirements yet." : "Nothing in this project is with you right now."}</p>`}
  </section>
  <section><h2>Members</h2>
  ${tbl(`<thead><tr><th>Name</th><th>Role</th>${manage ? "<th>Manage</th>" : ""}</tr></thead><tbody>${members.map(m => `
    <tr><td>${h(uname(m.uid))}</td><td>${h(m.role)}</td>${manage ? `<td>${m.role !== HEAD && (u.cto || m.role !== SH) ? `<button class="btn secondary" data-act="remove" data-pid="${pid}" data-uid="${m.uid}">Remove</button>` : ""}</td>` : ""}</tr>`).join("")}</tbody>`)}
  ${manage && others.length ? `<form data-form="addmember" data-pid="${pid}" class="row">
    <label for="am-user">Person<select id="am-user" name="uid">${others.map(x => `<option value="${x.id}">${h(x.name)}</option>`).join("")}</select></label>
    <label for="am-role">Role<select id="am-role" name="role">${ROLES.filter(r => u.cto || r !== SH).map(r => `<option>${r}</option>`).join("")}</select></label>
    <button class="btn primary">Add member</button></form>` : ""}
  </section>
  ${u.cto ? `<section class="panel"><h2>Project status</h2><form data-form="status" data-pid="${pid}" class="row">
    <label for="ps-status">Status<select id="ps-status" name="status">${STATUSES.map(s => `<option ${s === p.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
    <label class="check"><input type="checkbox" id="ps-confirm" name="confirm" value="yes"> I confirm closing (needed for Closed)</label>
    <button class="btn primary">Update status</button></form>
    <p class="note">On Hold and Cancelled block actions, hide requirements from My Queue and pause the stall timer.</p></section>` : ""}
  <section><h2>Project history</h2>${historyList(S.history.filter(x => x.pid === pid && !x.rid), u, pid)}</section>`;
}

function viewAdmin(u) {
  if (!u.cto) return "<h1>Not allowed</h1><p>Admin is for the CTO only.</p>";
  return `<h1>Admin</h1>
  <section><h2>Projects</h2><p>Codes are generated from the project name. You join every project as Project Head.</p>
    <button class="btn primary" data-act="open-project">New project</button></section>
  <section><h2>Users</h2><form data-form="newuser" class="stack narrow">
    <label for="nu-name">Full name<input id="nu-name" name="name" required></label>
    <label for="nu-username">Username<input id="nu-username" name="username" required></label>
    <label for="nu-email">Email<input id="nu-email" type="email" name="email"></label>
    <button class="btn primary">Add user</button></form>
    ${tbl(`<thead><tr><th>Name</th><th>Username</th><th>Email</th></tr></thead><tbody>${S.users.map(x => `<tr><td>${h(x.name)}${x.cto ? " (CTO)" : ""}</td><td>${h(x.username)}</td><td>${h(x.email)}</td></tr>`).join("")}</tbody>`)}
  </section>
  <section><h2>Email log</h2><p class="note">Demo only: emails the app would send. Newest first.</p>
    ${S.outbox.length ? S.outbox.map(m => `<div class="mail"><strong>${h(m.subject)}</strong><br>To ${h(m.to)} · ${fmt(m.at)}<pre>${h(m.body)}</pre></div>`).join("") : "<p>No emails yet. Act on a requirement to see one.</p>"}
  </section>`;
}

function render() {
  applyPrefs(); renderTop();
  const u = me(), v = S.view;
  const body = v.name === "projects" ? viewProjects(u) : v.name === "project" ? viewProject(u, v.id)
    : v.name === "admin" ? viewAdmin(u) : viewQueue(u);
  main.innerHTML = (S.flash ? `<div class="flash ${S.flash.type}" role="${S.flash.type === "error" ? "alert" : "status"}">${h(S.flash.text)}</div>` : "") + body;
  save();
}

// ---------- events ----------
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go, g.dataset.id ? +g.dataset.id : undefined); return; }
  if (e.target === modal) { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "close") { closeModal(); return; }
  if (act === "open-card") { S.flash = null; reqCard(+a.dataset.id); return; }
  if (act === "team-add") { modal.querySelector("#np-team").insertAdjacentHTML("beforeend", teamRow()); modal.querySelector("#np-team .team-row:last-child select").focus(); return; }
  if (act === "team-remove") { a.closest(".team-row").remove(); return; }
  if (act === "open-req") { reqDialog(+a.dataset.pid); return; }
  if (act === "open-project") { projectDialog(); return; }
  if (act === "wiz-next" || act === "wiz-back") { const f = modal.querySelector("form[data-form=newproject]"); wizGo(+f.dataset.step + (act === "wiz-next" ? 1 : -1)); return; }
  run(() => {
    if (a.dataset.act === "remove") { removeMember(me(), +a.dataset.pid, +a.dataset.uid); flash("ok", "Member removed."); }
    if (a.dataset.act === "download") flash("ok", `In the real app this downloads ${a.dataset.name} from the network share.`);
  });
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), u = me(), id = +f.dataset.id, pid = +f.dataset.pid;
  if (f.dataset.form === "newproject" && f.dataset.step !== "3") { wizGo(+f.dataset.step + 1); return; }
  run(() => {
    switch (f.dataset.form) {
      case "prefs": Object.assign(u, {theme: d.theme, font: d.font, size: +d.size}); flash("ok", "Settings saved to your account."); break;
      case "card": {
        const doIt = e.submitter && e.submitter.value, internal = d.internal === "yes";
        if (doIt === "comment") { addComment(u, id, d.comment, internal); return {reopen: id}; }
        const st = +d.stage, to = proceed(u, id, +d.to, d.comment, internal, st);
        flash("ok", st === 8 ? "Approved. The requirement is Closed." : `Sent to ${to} in ${STAGES[st]}. They were emailed.`); break;
      }
      case "newreq": {
        const internal = d.internal === "yes", st = +d.stage, doIt = e.submitter && e.submitter.value;
        if (!d.title.trim()) throw new RuleError("Give the requirement a title.");
        if (doIt === "send" && isFeedback(st) && !d.comment.trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one.");
        const rid = createReq(u, pid, d.title, d.desc, d.due, d.priority);
        [...f.querySelector("#nr-files").files].forEach(x => upload(u, rid, x.name));
        if (doIt === "send") {
          const to = proceed(u, rid, +d.to, d.comment, internal, st);
          flash("ok", `Requirement #${rid} created and sent to ${to} in ${STAGES[st]}. They were emailed.`);
        } else {
          if (d.comment.trim()) addComment(u, rid, d.comment, internal);
          flash("ok", `Requirement #${rid} created. It is in your queue.`);
        }
        break;
      }
      case "addmember": addMember(u, pid, +d.uid, d.role); flash("ok", "Member added."); break;
      case "status": setStatus(u, pid, d.status, d.confirm === "yes"); flash("ok", `Project status is now ${d.status}.`); break;
      case "newproject": {
        const np = createProject(u, d.name);
        teamPicks(f).forEach(t => addMember(u, np, t.uid, t.role));
        S.view = {name: "project", id: np}; flash("ok", `Project ${proj(np).code} created. Its folder was made on the share.`); break;
      }
      case "newuser": {
        const un = d.username.trim(); if (!un || !d.name.trim()) throw new RuleError("Name and username are required.");
        if (S.users.some(x => x.username === un)) throw new RuleError("That username already exists.");
        S.users.push({id: nextId("u"), username: un, name: d.name.trim(), email: d.email.trim(), cto: false, theme: "dark", font: "poppins", size: 2});
        flash("ok", "User added."); break;
      }
    }
  }, f);
});
document.addEventListener("change", e => {
  if (e.target.id !== "cd-file" || !e.target.files[0]) return;
  const rid = +e.target.dataset.rid, name = e.target.files[0].name, keep = (document.getElementById("cd-comment") || {}).value;
  run(() => { const saved = upload(me(), rid, name); flash("ok", `Saved as ${saved}.`); return {reopen: rid, comment: keep}; }, e.target.form);
});
document.addEventListener("change", e => {
  if (e.target.id !== "nr-files") return;
  const list = document.getElementById("nr-file-list"), names = [...e.target.files].map(x => x.name);
  list.innerHTML = names.length ? names.map(n => `<li class="file"><span class="ext" aria-hidden="true">${extOf(n)}</span><span class="file-main"><span class="file-name">${h(n)}</span><span class="file-meta">Uploads when you press Send or Keep it with me</span></span></li>`).join("") : `<li class="note">No files yet.</li>`;
});
document.addEventListener("input", e => {
  if (e.target.id === "np-name") {
    const c = genCode(e.target.value); document.getElementById("np-code").textContent = c;
    document.getElementById("np-folder").textContent = `${FILE_ROOT}\\${c}`;
  }
});
function run(fn, form) {
  const inModal = !!(form && modal.contains(form));
  let res;
  try { res = fn(); } catch (err) {
    if (!(err instanceof Forbidden || err instanceof RuleError)) throw err;
    const msg = (err instanceof Forbidden ? "Not allowed: " : "Cannot do that: ") + err.message;
    if (inModal) { const el = modal.querySelector("#modal-error"); el.textContent = msg; el.hidden = false; return; }
    flash("error", msg);
  }
  if (res && res.reopen) { render(); reqCard(res.reopen, res.comment); return; }
  if (inModal) closeModal();
  render();
  if (S.flash && S.flash.type === "error") window.scrollTo(0, 0);
}
document.getElementById("as-user").addEventListener("change", e => {
  S.me = +e.target.value; const u = me();
  if (S.view.name === "admin" && !u.cto) S.view = {name: "queue"};
  flash("ok", `Now viewing as ${u.name}${u.cto ? " (CTO)" : ""}. Roles: ${S.projects.filter(p => role(p.id, u.id)).map(p => `${p.code} ${role(p.id, u.id)}`).join(", ") || (u.cto ? "CTO on all projects" : "none")}.`);
  render();
});
const rc = document.getElementById("reset-confirm"), rb = document.getElementById("reset-demo");
rb.addEventListener("click", () => { rc.hidden = false; rb.hidden = true; });
document.getElementById("reset-no").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; });
document.getElementById("reset-yes").addEventListener("click", () => { rc.hidden = true; rb.hidden = false; seed(); flash("ok", "All projects and requirements were deleted."); render(); });

if (!load()) seed();
if (!S.darkDefault) { S.users.forEach(x => { x.theme = "dark"; }); S.darkDefault = true; }
S.flash = S.flash || {type: "ok", text: S.projects.length ? `You are viewing as ${me().name}. Use "Viewing as" above to switch person.`
  : `No projects yet. You are viewing as ${me().name} (CTO): press New project to start. Use "Viewing as" above to switch person.`};
render();
</script>
