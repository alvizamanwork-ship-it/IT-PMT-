html { font-size: var(--size); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.47;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 64rem; margin: 0 auto; padding-block: 1.25rem 3rem; }
h1 { font-size: 2.125rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: .25rem 0 1rem; text-wrap: balance; }
h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; margin: 1.75rem 0 .6rem; text-wrap: balance; }
a, .linkish { color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; text-decoration: none; }
.linkish:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Demo strip */
.demo { background: var(--demo); font-size: .85rem; border-bottom: 1px solid var(--sep); }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-block: .4rem; }
.demo-in strong { letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; }
.demo select { min-height: 2rem; padding: .15em .6em; }
.demo .btn { min-height: 2rem; padding: .25em .9em; font-size: .85rem; }

/* Navigation bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--sep); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding-block: .55rem; max-width: 64rem; margin: 0 auto; box-sizing: content-box; }
.topbar-in > strong { font-size: 1.05rem; letter-spacing: -.02em; }
.topbar nav { display: flex; flex-wrap: wrap; gap: .25rem; flex: 1; }
.topbar nav button { font-weight: 600; padding: .35rem .85rem; border-radius: 999px; }
.topbar nav button:hover { text-decoration: none; background: var(--tint); }
.topbar nav button[aria-current="page"] { background: var(--tint); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; padding: .4rem .95rem; border-radius: 999px; background: var(--tint); color: var(--accent); font-weight: 600; }
.menu summary::-webkit-details-marker { display: none; }
.menu-body { position: absolute; right: 0; z-index: 25; width: min(19rem, calc(100vw - 32px)); margin-top: .5rem; padding: 1rem;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: grid; gap: .9rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; font-size: .95rem; padding: 0 0 .35rem; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: .6rem; }
.seg { display: block; text-align: center; padding: .4rem .5rem; border-radius: .5rem; font-weight: 600; font-size: .9rem; cursor: pointer; }
.seg:has(input:checked) { background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .22); }
.seg:has(input:focus-visible) { outline: 3px solid var(--accent); }

/* Buttons */
.btn { font: inherit; font-size: 1rem; font-weight: 600; padding: .55em 1.25em; border-radius: 999px; cursor: pointer; border: 0;
  min-height: 2.75rem; letter-spacing: -.01em; transition: transform .12s ease, filter .12s ease; }
.btn.primary { background: var(--btn); color: var(--on-btn); }
.btn.secondary { background: var(--tint); color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }

/* Form controls */
label { display: grid; gap: .3rem; font-weight: 600; font-size: .95rem; }
input, select, textarea { font: inherit; font-size: 1rem; max-width: 100%; min-height: 2.75rem; border-radius: var(--radius-sm); }
select, input[type="date"], input[type="time"], input[type="number"] { color: var(--text); background: var(--surface-2); border: 1px solid var(--sep-strong); padding: .45em .6em; }
/* Text boxes are inverted panels with a metal rim: dark in Light mode, bright in Dark mode. */
textarea, input:not([type]), input[type="text"], input[type="email"], input[type="url"], input[type="search"] {
  color: var(--inv-fg); caret-color: var(--inv-link); padding: .55em .8em; border: 2px solid transparent;
  background: linear-gradient(var(--inv-bg), var(--inv-bg)) padding-box, var(--metal) border-box; }
textarea { width: 100%; resize: vertical; }
textarea::placeholder, input::placeholder { color: var(--inv-muted); opacity: 1; }
/* iOS switch for checkboxes */
label.check { display: flex; align-items: center; gap: .7rem; font-weight: 500; }
label.check input[type="checkbox"] { -webkit-appearance: none; appearance: none; flex: none; width: 3.1rem; height: 1.9rem; min-height: 0;
  margin: 0; border: 0; border-radius: 999px; background: var(--switch-off); position: relative; cursor: pointer; transition: background .2s; }
label.check input[type="checkbox"]::before { content: ""; position: absolute; top: .15rem; left: .15rem; width: 1.6rem; height: 1.6rem;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .2s; }
label.check input[type="checkbox"]:checked { background: var(--switch-on); }
label.check input[type="checkbox"]:checked::before { transform: translateX(1.2rem); }
.stack { display: grid; gap: .85rem; }
.stack > .btn { justify-self: start; }
.narrow { max-width: 24rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: .75rem 0; }
.row > label { min-width: 0; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
.head-row h1, .head-row h2 { margin-block: .5rem; }

/* Grouped lists */
.tbl { overflow-x: auto; margin: .5rem 0 1.25rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--card-shadow); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .7rem .9rem; vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--sep); }
tbody tr + tr td { border-top: 1px solid var(--sep); }
tbody tr:hover td { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .linkish { font-weight: 600; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 1.1rem; margin: var(--space) 0; box-shadow: var(--card-shadow); }
.panel > h2:first-child { margin-top: 0; }
summary { cursor: pointer; font-weight: 600; }
.pre { white-space: pre-wrap; }
.note { color: var(--muted); margin: 0; font-size: .9rem; }
.flash { border-radius: var(--radius); padding: .75rem 1rem; margin-bottom: 1rem; font-weight: 600; background: var(--surface);
  box-shadow: var(--card-shadow), inset 4px 0 0 currentColor; }
.flash.error { color: var(--error); }
.flash.ok { color: var(--ok); }
.history { padding-left: 1.5rem; margin: 0; }
.history li { margin-bottom: .5rem; }
.history strong { font-weight: 600; }
blockquote { margin: .3rem 0 0; padding-left: .75rem; border-left: 3px solid var(--sep-strong); }
code { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }
.crumb { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .3rem 1rem; margin: 0; }
.kv dt { font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; }
.stage-list { margin: .25rem 0 .75rem; padding-left: 1.75rem; display: grid; gap: .4rem; }
.team-row.wiz { display: grid; grid-template-columns: minmax(8rem, 11rem) minmax(0, 1fr) auto; gap: .75rem; align-items: start;
  padding-bottom: .85rem; border-bottom: 1px solid var(--sep); }
.team-row.wiz > .btn { margin-top: 1.75rem; }
@media (max-width: 40rem) { .team-row.wiz { grid-template-columns: 1fr; } .team-row.wiz > .btn { justify-self: start; margin-top: 0; } }
.role-picks { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
.role-extra { display: flex; gap: .5rem; align-items: end; }
.role-extra .linkish, .add-role { padding-bottom: .7rem; font-weight: 600; white-space: nowrap; }
.chip-x { background: none; border: 0; color: inherit; font: inherit; font-weight: 700; cursor: pointer; margin-left: .35rem; padding: 0 .15rem; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 .75rem; }

/* Chips: stage family, priority, comment type */
.label { display: inline-block; padding: .1rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--sep-strong); }
.label.st-an, .label.pr-normal { background: var(--an-bg); color: var(--an-fg); border-color: currentColor; }
.label.st-dev { background: var(--dev-bg); color: var(--dev-fg); border-color: currentColor; }
.label.st-qa { background: var(--qa-bg); color: var(--qa-fg); border-color: currentColor; }
.label.st-ap { background: var(--ap-bg); color: var(--ap-fg); border-color: currentColor; }
.label.st-fb, .label.pr-high { background: var(--fb-bg); color: var(--fb-fg); border-color: currentColor; }
.label.st-cl, .label.pr-low { background: var(--cl-bg); color: var(--cl-fg); border-color: currentColor; }
.label.st-new { background: var(--new-bg); color: var(--new-fg); border-color: currentColor; }
.label.tag-int { background: var(--int); color: var(--bg); border-color: var(--int); }
.label.tag-sh { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }

/* Sheets (popup cards) */
dialog.card { border: 0; border-radius: 1.1rem; padding: 0; width: min(46rem, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  background: var(--bg); color: var(--text); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .45); }
dialog.card[open] { display: flex; flex-direction: column; overflow: hidden; }
dialog.card > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
dialog.card::backdrop { background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .85rem 1.1rem; flex: none;
  background: var(--glass); border-bottom: 1px solid var(--sep); }

const modal = document.getElementById("modal");
// When the chosen stage is Approval, only the Project Head, Project Lead and Dev Lead can be picked.
function syncToOptions(form) {
  if (!form || !form.querySelector(".to-picks")) return;
  const st = form.querySelector("[name=stage]"), appr = st && +st.value === APPROVAL, canHead = form.querySelector(".to-picks").dataset.canhead === "1";
  form.querySelectorAll(".to-picks select").forEach(sel => {
    [...sel.options].forEach(o => {
      const head = o.dataset.head === "1";
      const off = head ? !(appr && canHead) : appr && o.dataset.lead !== "1";
      o.toggleAttribute("disabled", off); o.toggleAttribute("hidden", off);
    });
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled) { const ok = [...sel.options].find(o => !o.disabled); if (ok) sel.value = ok.value; }
  });
  let note = form.querySelector(".appr-note");
  if (!note) { form.querySelector(".to-picks").closest(".row").insertAdjacentHTML("afterend", `<p class="note appr-note" hidden></p>`); note = form.querySelector(".appr-note"); }
  note.hidden = false;
  note.textContent = appr ? (canHead ? "Approval can only be sent to the Project Head, Project Lead or Dev Lead." : "Approval can only be sent to the Project Lead or Dev Lead. They pass it on to the Project Head if needed.")
    : "The Project Head only receives approval requests, so they are not listed for this stage.";
}

  modal.querySelectorAll("form").forEach(syncToOptions);
}

  if (step > 1 && !name) { wizErr("Give the project a name first.", f.querySelector("#np-name")); return; }
  if (step > 1 && !endV) { wizErr("Set the project end date. It is required.", f.querySelector("#np-deadline")); return; }
  if (step > 1 && (startV || isoDay(now())) > endV) { wizErr("The end date must be on or after the start date.", f.querySelector("#np-deadline")); return; }
  if (step === 3) { const ty = f.querySelector("#np-type").value, bad = teamPicks(f).flatMap(t => t.roles).find(r => typeBlocks(ty, r));
    if (bad) { wizErr(`${ty} projects do not have a ${bad}. Change that role or the project type.`); return; } }
  if (step === 3) { try { teamPicks(f); } catch (err) { const e = modal.querySelector("#modal-error"); e.textContent = "Cannot do that: " + err.message; e.hidden = false; return; } }
  modal.querySelector("#modal-error").hidden = true;
  f.dataset.step = step;
  f.querySelectorAll("section[data-step]").forEach(sec => { sec.hidden = +sec.dataset.step !== step; });
  modal.querySelector("#wiz-line").innerHTML = wizPhases(step);
  f.querySelector("[data-act=wiz-back]").hidden = step === 1;
  f.querySelector("[data-act=wiz-next]").hidden = step === 3;
  f.querySelector("#np-create").hidden = step !== 3;
  if (step === 3) {
    const team = teamPicks(f).map(t => `${h(uname(t.uid))} (${h(t.roles.join(", "))})`);
    const heads = S.users.filter(x => x.cto).map(x => `${h(x.name)} (Project Head)`);
    modal.querySelector("#np-review").innerHTML = `<dl class="kv"><dt>Name</dt><dd>${h(name)}</dd><dt>Code</dt><dd>${genCode(f.querySelector("#np-type").value)}</dd>
      <dt>Folder</dt><dd><code>${h(FILE_ROOT)}\\${genCode(f.querySelector("#np-type").value)}</code></dd><dt>Type</dt><dd>${h(f.querySelector("#np-type").value)}</dd><dt>Status</dt><dd>${label("Active")}</dd>
      <dt>Priority</dt><dd>${priLabel(f.querySelector("#np-pri").value)}</dd><dt>Start date</dt><dd>${h(startV) || `${isoDay(now())} (today)`}</dd><dt>End date</dt><dd>${h(endV)}</dd>
      <dt>Team</dt><dd>${heads.concat(team).join("<br>")}</dd></dl>`;
    f.querySelector("#np-create").focus();
  } else { const first = f.querySelector(`section[data-step="${step}"] input, section[data-step="${step}"] select`); if (first) first.focus(); }
}

const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
function timelineCsv(u, pid) {
  const rows = timelineRows(u, pid), n = Math.max(1, ...rows.map(x => x.ends.length));
  const m = Math.max(1, ...rows.map(x => x.starts.length));
  const head = ["List", "Item"].concat(Array.from({length: m}, (_, i) => `Start date ${i + 1}`), Array.from({length: n}, (_, i) => `End date ${i + 1}`), ["Days deviated", "Start moved (days)", "Change reasons"]);
  const body = rows.map((x, i) => [i + 1, x.name].concat(Array.from({length: m}, (_, k) => x.starts[k] || ""), Array.from({length: n}, (_, k) => x.ends[k] || ""),
    [x.ends.length ? dayDiff(x.ends[0], x.ends[x.ends.length - 1]) : "", x.starts.length > 1 ? dayDiff(x.starts[0], x.starts[x.starts.length - 1]) : 0,
     Object.keys(x.startWhy).map(k => `Start date ${+k + 1}: ${x.startWhy[k]}`).concat(Object.keys(x.why).map(k => `End date ${+k + 1}: ${x.why[k]}`)).join(" | ")]));
  return [head].concat(body).map(r => r.map(csvCell).join(",")).join("\r\n");
}
function reportHtml(u, pid) {

  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(p.code)} · ${esc(p.name)} · Overview</title>
<style>body{font:14px/1.5 -apple-system,"Segoe UI",Inter,Arial,sans-serif;color:#1c1a17;max-width:62rem;margin:2rem auto;padding:0 1.25rem}

async function offerDownload(act, pid) {
  const status = document.getElementById("dl-status"), p = proj(pid), u = me();
  if (!downloadsCap) { if (status) status.textContent = "Downloads are not available in this view."; return; }
  const isCsv = act === "dl-csv";
  try {
    await downloadsCap.save({filename: `${p.code}_${isCsv ? "timeline.csv" : "overview.html"}`, data: isCsv ? timelineCsv(u, pid) : reportHtml(u, pid)});
    if (status) status.textContent = isCsv ? "Timeline saved." : "Overview report saved.";
  } catch (e) {
    const code = e && e.code;
    if (status) status.textContent = code === "declined" ? "Download cancelled." : code === "rate_limited" ? "A save prompt is already open. Try again in a moment." : "Downloads are not available in this view.";
    if (code && !["declined", "rate_limited"].includes(code)) document.querySelectorAll("[data-dl]").forEach(el => { el.hidden = true; });
  }
}

// Notifications: activity from the last 24 hours that this person is allowed to see, excluding their own actions.
const actorLabel = (pid, uid) => `${uname(uid)} (${role(pid, uid) || (user(uid) && user(uid).cto ? "CTO" : "former member")})`;
const lower = t => t.charAt(0).toLowerCase() + t.slice(1);
function notifText(x, u, p, r, toList) {

  const mine = toList.includes(u.id), others = toList.filter(t => t !== u.id).map(uname);
  if (a === "Send") return mine ? `assigned you requirement ${q} · ${STAGES[x.toStage]}${others.length ? ` (with ${others.join(", ")})` : ""}`
    : `sent requirement ${q} to ${toList.map(uname).join(", ") || "no one"} · ${STAGES[x.toStage]}`;
  if (a === "Created requirement") return `created requirement ${q}`;
  if (/^Requested (end date extension|start date change)/.test(a)) return `${lower(a)}${r ? ` (“${r.title}”)` : ` in ${p.code}`}: “${x.comment}”`;
  if (/^Approved (end date extension|start date change)/.test(a)) return `${mine ? "accepted your date change request" : lower(a)}${mine ? `${r ? ` for “${r.title}”` : ` in ${p.code}`}: ${a.replace(/^.*?: /, "")}` : r ? "" : ` in ${p.code}`}`;
  if (/^Declined (end date extension|start date change)/.test(a)) return `${mine ? "declined your date change request" : lower(a)}${r ? ` (“${r.title}”)` : ` in ${p.code}`}`;
  if (a === "Requested feedback") return `requested feedback on ${q}${x.comment ? `: “${x.comment}”` : ""}`;
  if (a === "Declined feedback request") return mine ? `declined your feedback request on ${q}` : `declined a feedback request on ${q}`;
  if (a === "Feedback approved") return mine ? `accepted a feedback request and sent you requirement ${q} · ${STAGES[x.toStage]}`
    : (x.fromList || []).includes(u.id) ? `accepted your feedback request on ${q}; it went to ${toList.map(uname).join(", ")} · ${STAGES[x.toStage]}`
    : `accepted a feedback request on ${q} and sent it to ${toList.map(uname).join(", ")} · ${STAGES[x.toStage]}`;
  if (a === "Unsent") return (x.fromList || []).includes(u.id) ? `took back requirement ${q}. It was sent to you by mistake; no action is needed.`
    : mine ? `took back requirement ${q}; it is with you again · ${STAGES[x.toStage]}` : `took back requirement ${q} from ${(x.fromList || []).map(uname).join(", ")}`;
  if (a === "Accepted and closed") return `approved and closed requirement ${q}`;
  if (a === "Reassign") return mine ? `reassigned requirement ${q} to you` : `reassigned requirement ${q} to ${toList.map(uname).join(", ")}`;
  if (r) return `${lower(a)} on ${q}`;
  if (a.startsWith("Added member as ")) return `${mine ? "added you" : `added ${uname(x.to)}`} to ${p.code} as ${a.slice(16)}`;
  if (a.startsWith("Added role ")) return `${mine ? "gave you" : `gave ${uname(x.to)}`} the role ${a.slice(11)} in ${p.code}`;
  if (a.startsWith("Removed")) return `${lower(a)}${x.from ? ` · ${x.from === u.id ? "you" : uname(x.from)}` : ""} in ${p.code}`;
  return `${lower(a)} in ${p.code}`;
}
function notifications(u) {

    const p = proj(x.pid); if (!p || !canView(u, x.pid)) return;
    const toList = (x.toList || [x.to]).filter(Boolean), aboutMe = toList.includes(u.id) || (x.fromList || [x.from]).includes(u.id);
    const r = x.rid ? req(x.rid) : null, open = r && canSeeReq(u, r);
    // Head, Project Lead and Dev Lead see all activity in their projects; everyone else only what is about them.
    if (!(aboutMe || (seesAll(u, x.pid) && (!r || open)))) return;
    out.push({at: x.at, who: actorLabel(x.pid, x.uid), text: notifText(x, u, p, r, toList), rid: open ? r.id : null, pid: x.pid, mine: toList.includes(u.id)});
  });

    if (c.at < since || c.uid === u.id) return;
    const r = req(c.rid); if (!r || !canSeeReq(u, r) || (c.internal && stakeholderView(u, r.pid))) return;
    if (!seesAll(u, r.pid)) {   // others: comments on what they hold, made after it reached them
      const got = (S.history.filter(x => x.rid === r.id && (x.toList || [x.to]).includes(u.id)).pop() || {}).at;
      if (!holds(r, u.id) || !got || c.at < got) return;
    }
    out.push({at: c.at, who: actorLabel(r.pid, c.uid), text: `commented on “${r.title}”${c.internal ? " (internal)" : ""}`, rid: r.id, pid: r.pid, mine: false});

}

    if (g.dataset.go === "project") { const box = document.getElementById("top-q-results"); if (box) box.hidden = true; S.flash = null; projectCard(+g.dataset.id, g.dataset.tab || "primary"); return; }

  if (e.target === modal) { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "close") { closeModal(); return; }
  if (act === "open-card") {
    S.flash = null; { const box = document.getElementById("top-q-results"); if (box) box.hidden = true; } const pw = modal.open && modal.querySelector(".pwrap");
    if (pw) modal.dataset.back = pw.dataset.pid; else if (!modal.open) modal.dataset.back = "";
    reqCard(+a.dataset.id); return;
  }
  if (act === "ptab") { setTab(a.dataset.tab); return; }
  if (act === "cal-day") { calDay = a.dataset.date; calYM = calDay.slice(0, 7); S.flash = null; render(); return; }
  if (act === "cal-move") { const [y, m] = calYM.split("-").map(Number), d = new Date(y, m - 1 + +a.dataset.d, 1); calYM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; S.flash = null; render(); return; }
  if (act === "rem-done") { const r = S.reminders.find(x => x.id === +a.dataset.id && x.uid === me().id); if (r) r.done = a.checked; S.flash = null; render(); return; }
  if (act === "rem-del") { S.reminders = S.reminders.filter(x => !(x.id === +a.dataset.id && x.uid === me().id)); flash("ok", "Reminder deleted."); render(); return; }
  if (act === "note-del") { S.notes = S.notes.filter(x => !(x.id === +a.dataset.id && x.uid === me().id)); flash("ok", "Note deleted."); render(); return; }
  if (act === "dl-report" || act === "dl-csv") { offerDownload(act, +a.dataset.pid); return; }
  if (act === "back-project") { S.flash = null; projectCard(+modal.dataset.back); return; }
  if (act === "add-dummy" || act === "add-dummy-new") { addDummy(a); return; }
  if (act === "add-link" || act === "add-link-new") { addLinkUi(a); return; }
  if (act === "drop-dummy") { const list = a.closest("ul"); a.closest("li").remove();
    if (!list.querySelector("li")) list.innerHTML = `<li class="note">${list.id === "nr-link-list" ? "No links yet." : "No files yet."}</li>`; return; }
  if (act === "role-add") {
    const box = a.closest(".role-picks"), first = box.querySelector("select"), id = `rp-${++teamSeq}`;
    const used = [...box.querySelectorAll("select")].map(x => x.value), next = [...first.options].find(o => !used.includes(o.value));
    a.insertAdjacentHTML("beforebegin", `<div class="role-extra"><label for="${id}">${a.dataset.more || "Another role"}${first.outerHTML.replace(/ id="[^"]*"/, ` id="${id}"`).replace(/ name="[^"]*"/, "")}</label>
      <button type="button" class="linkish" data-act="role-drop">${a.dataset.drop || "Remove role"}</button></div>`);
    const sel = document.getElementById(id); sel.value = next ? next.value : first.value; syncToOptions(a.closest("form")); sel.focus(); return;
  }
  if (act === "role-drop") { a.closest(".role-extra").remove(); return; }
  if (act === "team-add") { modal.querySelector("#np-team").insertAdjacentHTML("beforeend", teamRow()); modal.querySelector("#np-team .team-row:last-child select").focus(); return; }
  if (act === "team-remove") { a.closest(".team-row").remove(); return; }
  if (act === "open-req") { reqDialog(+a.dataset.pid); return; }
  if (act === "open-project") { projectDialog(); return; }
  if (act === "wiz-next" || act === "wiz-back") { const f = modal.querySelector("form[data-form=newproject]"); wizGo(+f.dataset.step + (act === "wiz-next" ? 1 : -1)); return; }
  run(() => {
    if (act === "approve-close") { const r = req(+a.dataset.id); accept(me(), r.id, ""); flash("ok", `${reqCode(r)} approved and closed.`); }
    if (act === "unsend") { const res = unsend(me(), +a.dataset.hid); flash("ok", `Unsent from ${res.names}. “${res.title}” is back in your queue at ${res.stage}.`); }
    if (act === "remove-role") { removeRole(me(), +a.dataset.pid, +a.dataset.uid, a.dataset.role); flash("ok", `Role ${a.dataset.role} removed.`); return {reopenProject: +a.dataset.pid}; }
    if (act === "remove") { removeMember(me(), +a.dataset.pid, +a.dataset.uid); flash("ok", "Member removed."); return {reopenProject: +a.dataset.pid}; }
    if (act === "ext-decide") {
      const ok = a.dataset.ok === "1"; decideExt(me(), a.dataset.kind, +a.dataset.id, ok);
      flash("ok", ok ? "Date change accepted. It is now in the Timeline." : "Date change declined. The date stays as it was.");
      if (modal.open && modal.querySelector("form[data-form=card]")) return {reopen: +a.dataset.id};
      if (modal.open) return {reopenProject: +a.dataset.pid, tab: modal.dataset.tab || "overview"};
    }
    if (act === "download") flash("ok", `${a.dataset.name} is a dummy file with no content. In the real app this downloads it from the network share.`);
  }, a);
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), u = me(), id = +f.dataset.id, pid = +f.dataset.pid;
  if (f.dataset.form === "newproject" && f.dataset.step !== "3") { wizGo(+f.dataset.step + 1); return; }
  run(() => {
    switch (f.dataset.form) {
      case "remadd": {
        if (!d.title.trim()) throw new RuleError("Write what to remember.");
        if (!d.date) throw new RuleError("Pick a date.");
        (S.reminders = S.reminders || []).push({id: nextId("rm"), uid: u.id, date: d.date, time: d.time || "", title: d.title.trim(), note: (d.note || "").trim(), done: false, at: now()});
        calDay = d.date; calYM = d.date.slice(0, 7); flash("ok", `Reminder added for ${d.date}${d.time ? " at " + d.time : ""}.`); break;
      }
      case "noteadd": {
        if (!d.body.trim()) throw new RuleError("Write the note first.");
        (S.notes = S.notes || []).push({id: nextId("nt"), uid: u.id, pid: +d.pid || null, title: (d.title || "").trim(), body: d.body.trim(), at: now()}); flash("ok", "Note added."); break;
      }
      case "prefs": Object.assign(u, {theme: d.theme, font: d.font, size: +d.size, bri: +d.bri || 3, con: 3, accent: ACCENTS.some(a => a[0] === d.accent) ? d.accent : "red"}); flash("ok", "Settings saved to your account."); break;
      case "card": {
        const doIt = e.submitter && e.submitter.value, internal = d.internal === "yes";
        if (doIt === "comment") { addComment(u, id, d.comment, internal); return {reopen: id}; }
        if (doIt === "approve") { accept(u, id, d.comment); flash("ok", `${reqCode(req(id))} approved and closed.`); break; }
        if (doIt === "extreq") { const res = requestExt(u, "req", id, d.extdate, d.extreason, d.extfield); flash("ok", res === "applied" ? "Date changed. The Timeline keeps the earlier date and your reason." : "Date change requested. The Project Lead or Project Head can now accept or decline it."); return {reopen: id}; }
        if (doIt === "fbreq") { requestFeedback(u, id, d.fbreason); flash("ok", "Feedback requested. The Project Head, Project Lead and Dev Lead can now accept it."); return {reopen: id}; }
        if (doIt === "fbaccept") { const to = decideFeedback(u, id, true, +d.fbstage, +d.fbto, d.fbnote); flash("ok", `Feedback request accepted. Sent to ${to} in ${STAGES[+d.fbstage]}.`); break; }
        if (doIt === "fbdecline") { const who = decideFeedback(u, id, false, 0, 0, d.fbnote); flash("ok", `Feedback request declined. It stays with ${who}.`); return {reopen: id}; }
        const st = +d.stage, to = proceed(u, id, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
        flash("ok", st === 8 ? "Approved. The requirement is Closed." : `Sent to ${to} in ${STAGES[st]}. They were emailed.`); break;
      }
      case "newreq": {
        const internal = d.internal === "yes", st = +d.stage, doIt = e.submitter && e.submitter.value;
        if (!d.title.trim()) throw new RuleError("Give the requirement a title.");
        if (doIt === "send" && isFeedback(st) && !d.comment.trim()) throw new RuleError("Write a comment. Sending to a Feedback stage needs one.");
        const rid = createReq(u, pid, d.title, d.desc, d.due, d.priority, d.start);
        [...f.querySelectorAll("#nr-file-list li[data-name]")].forEach(li => upload(u, rid, li.dataset.name));
        [...f.querySelectorAll("#nr-link-list li[data-url]")].forEach(li => addLink(u, rid, li.dataset.url, li.dataset.label));
        if (doIt === "send") {
          const to = proceed(u, rid, [...f.querySelectorAll(".to-picks select")].map(x => +x.value), d.comment, internal, st);
          flash("ok", `Requirement ${reqCode(req(rid))} created and sent to ${to} in ${STAGES[st]}. They were emailed.`);
        } else {
          if (d.comment.trim()) addComment(u, rid, d.comment, internal);
          flash("ok", `Requirement ${reqCode(req(rid))} created. It is in your queue.`);
        }
        return {reopenProject: pid};
      }
      case "addmember": addMember(u, pid, +d.uid, [...f.querySelectorAll(".np-role")].map(x => x.value)); flash("ok", "Saved. Roles updated."); return {reopenProject: pid};
      case "plan": setPlan(u, pid, d.priority, proj(pid).start); flash("ok", "Project priority saved."); return {reopenProject: pid, tab: "overview"};
      case "extreq": {
        const [kind, xid] = (d.item || "").split(":"), res = requestExt(u, kind, +xid, d.date, d.reason, d.field);
        flash("ok", res === "applied" ? "Date changed. The Timeline keeps the earlier date and your reason." : "Date change requested. The Project Lead or Project Head can now accept or decline it.");
        return {reopenProject: pid, tab: "overview"};
      }
      case "overview": submitOverview(u, pid, d); flash("ok", "Overview sent for approval. The Project Head or Project Lead approves it."); return {reopenProject: pid, tab: "overview"};
      case "ovdecide": { const ok = e.submitter && e.submitter.value === "accept"; decideOverview(u, pid, ok, d.note);
        flash("ok", ok ? "Overview approved. It is now read-only." : "Overview declined. It went back to the person who sent it."); return {reopenProject: pid, tab: "overview"}; }
      case "status": setStatus(u, pid, d.status, d.confirm === "yes"); flash("ok", d.status === "Closed" ? "Project closed. It is now in the Archive." : `Project status is now ${d.status}.`); return {reopenProject: pid};
      case "newproject": {
        const np = createProject(u, d.name, d.priority, d.deadline, d.start, d.type);
        teamPicks(f).forEach(t => addMember(u, np, t.uid, t.roles));
        S.view = {name: "projects"}; flash("ok", `Project ${proj(np).code} created. Its folder was made on the share.`); return {reopenProject: np};
      }
      case "newrole": {
        if (!u.cto) throw new Forbidden("Only the CTO adds roles.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a role name.");
        if ([HEAD].concat(S.roles).some(r => r.toLowerCase() === n.toLowerCase())) throw new RuleError("That role already exists.");
        S.roles.push(n); syncLists(); flash("ok", `Role "${n}" added. It is now in every role dropdown.`); break;
      }
      case "newstage": {
        if (!u.cto) throw new Forbidden("Only the CTO adds stages.");
        const n = d.name.trim(); if (!n) throw new RuleError("Type a stage name.");
        if (S.stages.some(x => x.name.toLowerCase() === n.toLowerCase())) throw new RuleError("That stage already exists.");
        const id = Math.max(...S.stages.map(x => x.id)) + 1, folders = new Set(S.stages.map(x => x.folder)).size;
        const folder = `${String(folders + 1).padStart(2, "0")}_${clean(n, 40).replace(/ /g, "_")}`;
        S.stages.splice(S.stages.findIndex(x => x.id === 8), 0, {id, name: n, feedback: d.feedback === "yes", folder, cls: d.feedback === "yes" ? "st-fb" : "st-new"});
        syncLists(); flash("ok", `Stage "${n}" added. It is now in the Stage dropdown when sending.`); break;
      }
      case "newuser": {
        const un = d.username.trim(); if (!un || !d.name.trim()) throw new RuleError("Name and username are required.");
        if (S.users.some(x => x.username === un)) throw new RuleError("That username already exists.");
        S.users.push({id: nextId("u"), username: un, name: d.name.trim(), email: d.email.trim(), cto: false, theme: "dark", font: "century", size: 2, bri: 3, con: 3});
        flash("ok", "User added."); break;
      }
    }
  }, f);
});
// Top bar search: projects you can open, matched by code or name.
function topSearch(q) {
  const box = document.getElementById("top-q-results"), u = me(); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const first = (a, b) => (b.startsWith(q)) - (a.startsWith(q)) || a.localeCompare(b);
  const projects = S.projects.filter(p => canView(u, p.id) && (p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)))
    .sort((a, b) => first(a.code.toLowerCase(), b.code.toLowerCase())).slice(0, 5);
  const reqs = S.reqs.filter(r => canSeeReq(u, r) && (reqCode(r).toLowerCase().includes(q) || r.title.toLowerCase().includes(q)))
    .sort((a, b) => first(reqCode(a).toLowerCase(), reqCode(b).toLowerCase())).slice(0, 6);
  box.innerHTML = !projects.length && !reqs.length ? `<li class="none">Nothing matches “${h(q)}”. You only find projects you belong to and requirements you can open.</li>`
    : (projects.length ? `<li class="grp">Projects</li>` + projects.map(p => `<li><button type="button" data-go="project" data-id="${p.id}"><span class="code">${h(p.code)}</span><span class="pname">${h(p.name)}</span>${label(p.status, p.status === "Active" ? "st-ap" : "st-cl")}</button></li>`).join("") : "")
    + (reqs.length ? `<li class="grp">Requirements</li>` + reqs.map(r => `<li><button type="button" data-act="open-card" data-id="${r.id}"><span class="code">${h(reqCode(r))}</span><span class="pname">${h(r.title)}</span>${stageLabel(r.stage)}</button></li>`).join("") : "");
  box.hidden = false;
}

// Dummy files: a name only, for trying the flow without real files.
function addLinkUi(btn) {
  const isNew = btn.dataset.act === "add-link-new", pre = isNew ? "nr-link" : "cd-link", err = modal.querySelector("#modal-error");
  const urlIn = document.getElementById(pre + "-url"), labelIn = document.getElementById(pre + "-label");
  if (isNew) {
    let url; try { url = cleanUrl(urlIn.value); } catch (e) { err.textContent = "Cannot do that: " + e.message; err.hidden = false; urlIn.focus(); return; }
    err.hidden = true;
    const list = document.getElementById("nr-link-list"), note = list.querySelector("li.note"); if (note) note.remove();

      .replace('<li class="file">', `<li class="file" data-url="${h(url)}" data-label="${h(labelIn.value.trim())}">`));
    urlIn.value = ""; labelIn.value = ""; urlIn.focus(); return;

  const rid = +btn.dataset.rid, keep = (document.getElementById("cd-comment") || {}).value;

}

document.addEventListener("keydown", e => {

function run(fn, form) {
  const inModal = !!(form && modal.contains(form));
  let res;
  try { res = fn(); } catch (err) {
    if (!(err instanceof Forbidden || err instanceof RuleError)) throw err;
    const msg = (err instanceof Forbidden ? "Not allowed: " : "Cannot do that: ") + err.message;
    if (inModal) { const el = modal.querySelector("#modal-error"); el.textContent = msg; el.hidden = false; el.scrollIntoView({block: "nearest"}); return; }
    flash("error", msg);
  }
  if (res && res.reopen) { render(); reqCard(res.reopen, res.comment); return; }
  if (res && res.reopenProject) { render(); projectCard(res.reopenProject, res.tab); return; }
  if (inModal) closeModal();
  render();
  if (S.flash && S.flash.type === "error") window.scrollTo(0, 0);
}
